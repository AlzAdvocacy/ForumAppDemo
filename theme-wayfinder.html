<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alz Advocacy Forum (Wayfinder theme)</title>
<meta name="description" content="Prototype of the Advocacy Forum attendee app. All names, meetings and schedules are fictional.">
<meta name="theme-color" content="#4A0D66">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Alz Forum">
<meta name="application-name" content="Alz Forum">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="preload" href="fonts/archivo-latin-900-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
:root{
  --font:'Atkinson Hyperlegible','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --purple:#5E2B86; --purple-deep:#3C1A5B; --purple-soft:#EEE6F5; --purple-tint:#F7F3FA;
  --ink:#241A2E; --ink-2:#5B5064; --ink-3:#857B8E; --line:#E3DCEA; --line-strong:#CFC5D8;
  --paper:#FFFFFF; --canvas:#F5F2F7;
  --ok:#2E7D4F; --ok-soft:#E4F2E9;
  --warn:#A75A0A; --warn-soft:#FBEEDC;
  --moved:#1F5FA6; --moved-soft:#E3EDF8;
  --bad:#B3261E; --bad-soft:#F9E3E1;
  --focus:#1F5FA6;
  --page-bg:#E9E3EE; --demo-bg:#263141; --demo-ink:#E7EBF1; --demo-muted:#A9B4C4;
  --radius:14px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--page-bg:#15111B;--demo-bg:#0E0B13}
}
:root[data-theme="dark"]{--page-bg:#15111B;--demo-bg:#0E0B13}

body{font-family:var(--font);background:var(--page-bg);color:var(--ink);line-height:1.45;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Demo control bar (not part of the app) ---------- */
.demo{background:var(--demo-bg);color:var(--demo-ink);padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;border-bottom:3px dashed #5A6B85;font-size:14px}
.demo .demo-title{font-weight:700;background:#F2C94C;color:#2A2A2A;padding:4px 10px;border-radius:6px;letter-spacing:.2px}
.demo .group{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.demo .group > span{color:var(--demo-muted)}
.demo .seg{display:inline-flex;border:1px solid #5A6B85;border-radius:8px;overflow:hidden}
.demo .seg button{background:transparent;border:0;color:var(--demo-ink);padding:7px 12px;min-height:36px}
.demo .seg button.on{background:#E7EBF1;color:#1C2431;font-weight:700}
.demo select,.demo input{background:#1A2230;border:1px solid #5A6B85;color:var(--demo-ink);border-radius:8px;padding:7px 8px;min-height:36px}
.demo input{width:92px;text-transform:uppercase}
.demo .dbtn{background:#3A4A63;border:1px solid #5A6B85;color:var(--demo-ink);border-radius:8px;padding:7px 11px;min-height:36px}
.demo .dbtn:hover{background:#4A5C78}
.demo .dbtn.on{background:#C2410C;border-color:#C2410C}
.demo .codes{color:var(--demo-muted);font-size:13px;width:100%;line-height:1.7}
.demo .collapse{margin-left:auto}
.demo.collapsed .hide-when-collapsed{display:none}
.demo .codes b{color:var(--demo-ink);font-weight:400}
.demo .codes code{font-family:inherit;background:#1A2230;padding:1px 6px;border-radius:5px;margin-right:4px}

/* ---------- Stage and phone frame ---------- */
.stage{flex:1;min-height:0;display:flex;justify-content:center;align-items:stretch;padding:16px}
.phone{position:relative;width:100%;max-width:400px;max-height:860px;background:var(--canvas);color:var(--ink);
  border-radius:30px;box-shadow:0 20px 50px rgba(30,10,50,.25),0 0 0 1px rgba(0,0,0,.06);overflow:hidden;display:flex;flex-direction:column}
@media (max-width:480px){.stage{padding:0}.phone{border-radius:0;max-height:none;box-shadow:none}}
.phone[data-text="large"]{font-size:117%}
.phone[data-contrast="high"]{--ink:#000;--ink-2:#1A1A1A;--ink-3:#333;--line:#777;--line-strong:#444;--canvas:#fff;--purple-soft:#E6DBF0;--purple:#3C1A5B}
.phone[data-contrast="high"] .meeting{border-color:#444}
.phone[data-contrast="high"] .pill{border:1px solid currentColor}

/* App header */
.app-head{background:var(--purple);color:#fff;padding:14px 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0}
.app-head .wordmark{font-weight:700;font-size:1.05em;letter-spacing:.2px}
.app-head .sub{font-size:.8em;opacity:.85}
.proto{font-size:.7em;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);border-radius:99px;padding:3px 9px;white-space:nowrap}
.staff-head{background:var(--purple-deep)}

/* Offline banner */
.offline-banner{background:#2A2A2A;color:#fff;padding:9px 16px;font-size:.9em;display:flex;gap:8px;align-items:center;flex-shrink:0}
.offline-banner .dot{width:10px;height:10px;border-radius:50%;background:#F2C94C;flex-shrink:0}

/* Screen body */
.screen{flex:1;min-height:0;overflow:auto;padding:16px 16px 24px;-webkit-overflow-scrolling:touch}
.screen h1{font-size:1.5em;margin:0 0 4px;line-height:1.2}
.screen h2{font-size:1.15em;margin:22px 0 10px}
.screen h3{font-size:1em;margin:14px 0 6px}
.lede{color:var(--ink-2);margin:0 0 14px}
.muted{color:var(--ink-2)}
.small{font-size:.88em}
.tiny{font-size:.8em;color:var(--ink-3)}
.updated{font-size:.8em;color:var(--ink-3);margin:0 0 12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
hr.soft{border:0;border-top:1px solid var(--line);margin:18px 0}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 16px;border-radius:12px;border:1px solid var(--line-strong);background:var(--paper);color:var(--ink);font-weight:700;text-align:center;text-decoration:none}
.btn:hover{background:var(--purple-tint)}
.btn-primary{background:var(--purple);border-color:var(--purple);color:#fff}
.btn-primary:hover{background:var(--purple-deep)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--purple)}
.btn-danger{color:var(--bad);border-color:var(--bad)}
.btn-block{width:100%}
.btn-sm{min-height:38px;padding:6px 12px;font-size:.92em;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.back{background:none;border:0;color:var(--purple);font-weight:700;padding:6px 0;min-height:44px;display:inline-flex;align-items:center;gap:6px;margin-bottom:4px}
.link{background:none;border:0;color:var(--purple);font-weight:700;padding:4px 0;text-decoration:underline;min-height:32px}

/* Inputs */
label.field{display:block;margin:12px 0}
label.field > span{display:block;font-weight:700;margin-bottom:6px}
.input,select.input,textarea.input{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line-strong);border-radius:12px;background:var(--paper)}
textarea.input{min-height:90px;resize:vertical}
.code-input{font-size:1.6em;letter-spacing:.3em;text-transform:uppercase;text-align:center;font-weight:700}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;min-height:44px}
.check input{width:22px;height:22px;margin-top:2px;flex-shrink:0;accent-color:var(--purple)}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{border:1px solid var(--line-strong);border-radius:99px;padding:9px 14px;min-height:44px;display:inline-flex;align-items:center;gap:6px;background:var(--paper)}
.radios input{accent-color:var(--purple);width:18px;height:18px}
.radios label:has(input:checked){background:var(--purple-soft);border-color:var(--purple);font-weight:700}
.switch{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);min-height:52px;gap:12px}
.switch input{width:44px;height:26px;appearance:none;background:#C9C1D1;border-radius:99px;position:relative;flex-shrink:0;transition:background .15s}
.switch input:checked{background:var(--purple)}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.switch input:checked::after{left:21px}

/* Pills and status */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.8em;font-weight:700;border-radius:99px;padding:3px 10px;background:var(--purple-soft);color:var(--purple-deep);white-space:nowrap}
.pill.confirmed{background:var(--ok-soft);color:var(--ok)}
.pill.tentative{background:var(--warn-soft);color:var(--warn)}
.pill.moved{background:var(--moved-soft);color:var(--moved)}
.pill.cancelled{background:var(--bad-soft);color:var(--bad)}
.pill.lead{background:#FFF1C9;color:#6B4E00}
.pill.off{background:#EEE;color:#444}

/* Home */
.hero{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.hero .when{font-size:.9em;color:var(--ink-2)}
.hero .big{font-size:1.9em;font-weight:700;line-height:1.1;margin:4px 0 6px;letter-spacing:-.01em}
.hero .count{font-size:1.05em;color:var(--purple-deep);font-weight:700}
.changes{background:var(--moved-soft);border-left:6px solid var(--moved);border-radius:0 14px 14px 0;padding:12px 14px;margin-bottom:14px}
.changes.none{background:var(--ok-soft);border-left-color:var(--ok)}
.changes h2{margin:0 0 6px;font-size:1.05em}
.changes li{margin:6px 0}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.quick .btn{min-height:60px;flex-direction:column;gap:2px;font-weight:700;align-items:flex-start;text-align:left}
.quick .btn small{font-weight:400;color:var(--ink-2)}

/* Agenda */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.chips button{flex-shrink:0;border:1px solid var(--line-strong);background:var(--paper);border-radius:99px;padding:9px 14px;min-height:44px;font-weight:700}
.chips button.on{background:var(--purple);border-color:var(--purple);color:#fff}
.chips.sub button{min-height:38px;padding:6px 12px;font-weight:400}
.chips.sub button.on{background:var(--purple-soft);color:var(--purple-deep);border-color:var(--purple)}
.rail{position:relative;padding-left:84px}
.rail .item{position:relative;padding:10px 0 14px;border-bottom:1px solid var(--line)}
.rail .item:last-child{border-bottom:0}
.rail .t{position:absolute;left:-84px;top:11px;width:74px;white-space:nowrap;font-weight:700;font-size:.92em;line-height:1.25;color:var(--ink)}
.rail .t small{display:block;font-weight:400;color:var(--ink-3);font-size:.85em}
.rail .title{font-weight:700;margin-bottom:2px;padding-right:48px}
.rail .room{font-size:.9em;color:var(--ink-2)}
.rail .desc{font-size:.9em;color:var(--ink-2);margin-top:4px}
.rail .block{font-size:.8em;color:var(--purple-deep);background:var(--purple-soft);display:inline-block;border-radius:6px;padding:1px 7px;margin-bottom:4px}
.star{position:absolute;right:0;top:6px;width:44px;height:44px;border:0;background:none;font-size:1.5em;color:var(--line-strong);border-radius:50%}
.star.on{color:#D9A400}
.rail .item.general{background:linear-gradient(90deg,var(--purple-tint),transparent);margin-left:-8px;padding-left:8px;border-radius:8px}

/* Meetings */
.meeting{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:0 0 10px;text-align:left;width:100%;padding:0}
.meeting .strip{width:8px;flex-shrink:0;background:var(--ok)}
.meeting.tentative .strip{background:var(--warn)}
.meeting.moved .strip{background:var(--moved)}
.meeting.cancelled .strip{background:var(--bad)}
.meeting .body{padding:12px 14px;flex:1;min-width:0}
.meeting .time,.meeting .who,.meeting .where{display:block}
.meeting .time{font-weight:700;font-size:1.05em}
.meeting .time s{color:var(--ink-3);font-weight:400;margin-right:6px}
.meeting .who{font-weight:700;margin-top:2px}
.meeting .where{color:var(--ink-2);font-size:.92em}
.meeting .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center;font-size:.88em;color:var(--ink-2)}
.meeting.cancelled .who,.meeting.cancelled .where{color:var(--ink-3)}
.warnrow{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);border:1px dashed var(--warn);border-radius:12px;padding:10px 12px;margin:-2px 0 12px;font-size:.92em;color:#5A3200}
.warnrow .ico{font-size:1.2em;line-height:1}
.detail-head{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.detail-head .time{font-size:1.4em;font-weight:700}
.detail-head .time s{color:var(--ink-3);font-weight:400;font-size:.8em;margin-right:6px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;margin:8px 0;font-size:.95em}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;font-weight:700}
.team li{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.team li:last-child{border:0}
.team .you{color:var(--purple);font-size:.85em;font-weight:700;margin-left:6px}
.history{border-left:3px solid var(--moved);padding-left:12px;margin:8px 0;font-size:.92em}
.history li{margin:6px 0}
details.prep{background:var(--paper);border:1px solid var(--line);border-radius:12px;margin:8px 0;padding:0 14px}
details.prep summary{cursor:pointer;font-weight:700;padding:13px 0;min-height:48px;display:flex;align-items:center;justify-content:space-between;list-style:none}
details.prep summary::-webkit-details-marker{display:none}
details.prep summary::after{content:"+";font-size:1.3em;color:var(--purple)}
details.prep[open] summary::after{content:"\2212"}
details.prep .inner{padding:0 0 14px;color:var(--ink-2);font-size:.95em}
details.prep .inner p{margin:6px 0}
.ph{border:1px dashed var(--line-strong);border-radius:10px;padding:10px;color:var(--ink-3);font-style:italic;background:var(--canvas)}

/* Map */
.mapwrap{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:10px;margin:10px 0}
.mapwrap svg{width:100%;height:auto;display:block}
.walk{display:grid;grid-template-columns:1fr auto 1fr auto;gap:6px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:.92em}
.walk:last-child{border:0}
.walk .arrow{color:var(--ink-3)}
.walk .mins{font-weight:700;white-space:nowrap}
.walk .mins.tight{color:var(--warn)}

/* Alerts */
.notif{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.notif .ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--purple-soft);font-size:1.2em}
.notif.change .ico{background:var(--moved-soft)}
.notif .nb{flex:1;min-width:0}
.notif .nt{font-weight:700}
.notif.unread .nt::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--purple);margin-right:6px;vertical-align:middle}
.notif .nd{color:var(--ink-2);font-size:.92em}
.notif .nw{color:var(--ink-3);font-size:.8em;margin-top:2px}

/* Push banner (simulated phone notification) */
.push{position:absolute;left:10px;right:10px;top:10px;z-index:30;background:rgba(250,248,252,.97);color:#111;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.28);padding:12px 14px;display:flex;gap:12px;align-items:flex-start;transform:translateY(-130%);transition:transform .35s cubic-bezier(.2,.8,.2,1);border:0;text-align:left;width:auto;font-family:var(--font)}
.push.show{transform:translateY(0)}
.push .app-ico{width:38px;height:38px;border-radius:9px;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.push .pt{font-weight:700;font-size:.95em;display:flex;justify-content:space-between;gap:8px}
.push .pt small{font-weight:400;color:#666}
.push .pb{font-size:.9em;color:#222;margin-top:2px}
.toast{position:absolute;left:14px;right:14px;bottom:86px;z-index:29;background:#2A2A2A;color:#fff;border-radius:12px;padding:10px 14px;font-size:.9em;opacity:0;transform:translateY(10px);transition:all .25s;pointer-events:none;text-align:center}
.toast.show{opacity:1;transform:translateY(0)}
@media (prefers-reduced-motion:reduce){.push,.toast,.switch input,.switch input::after{transition:none}}

/* Onboarding */
.steps{display:flex;gap:6px;margin-bottom:14px}
.steps span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps span.on{background:var(--purple)}
.phone-mock{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0;text-align:center}
.phone-mock .ios{display:inline-flex;align-items:center;gap:8px;background:#EFEFF4;border-radius:12px;padding:10px 14px;font-weight:700;color:#111;margin:6px 0}
.phone-mock .allow{display:flex;gap:1px;margin-top:10px;border-radius:12px;overflow:hidden;border:1px solid #ccc}
.phone-mock .allow span{flex:1;padding:10px;background:#fff;color:#0A60FF;font-weight:700}
.phone-mock .allow span:first-child{border-right:1px solid #ccc;font-weight:400}

/* Lists */
.menu button{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;min-height:56px;margin-bottom:8px;text-align:left;font-weight:700}
.menu button small{display:block;font-weight:400;color:var(--ink-2);font-size:.88em}
.menu button::after{content:"\203A";font-size:1.4em;color:var(--ink-3)}
.contact{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.contact b{display:block}
.contact span{color:var(--ink-2);font-size:.92em}
.announce{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.announce .at{font-size:.8em;color:var(--ink-3)}
.announce h3{margin:2px 0 4px}
.empty{text-align:center;color:var(--ink-2);padding:28px 16px;border:1px dashed var(--line-strong);border-radius:14px}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

/* Entry */
.entry{padding-top:18px}
.entry .mark{font-size:1.6em;font-weight:700;color:var(--purple-deep);letter-spacing:-.01em;margin-bottom:2px}
.entry .dates{color:var(--ink-2);margin-bottom:26px}
.err{background:var(--bad-soft);border-left:5px solid var(--bad);border-radius:0 10px 10px 0;padding:10px 12px;margin:12px 0;color:#5A1410}

/* Bottom tabs */
.tabs{display:flex;background:var(--paper);border-top:1px solid var(--line);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;background:none;border:0;padding:8px 2px 9px;min-height:60px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.74em;color:var(--ink-2);position:relative;font-weight:700}
.tabs button .ti{font-size:1.45em;line-height:1}
.tabs button.on{color:var(--purple)}
.tabs button.on::before{content:"";position:absolute;top:0;left:20%;right:20%;height:3px;background:var(--purple);border-radius:0 0 3px 3px}
.tabs .badge{position:absolute;top:6px;right:calc(50% - 22px);background:var(--bad);color:#fff;border-radius:99px;font-size:.75em;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 5px}

/* ---------- Staff view ---------- */
.stafftabs{display:flex;gap:4px;overflow-x:auto;background:var(--paper);border-bottom:1px solid var(--line);padding:6px 8px;flex-shrink:0}
.stafftabs button{flex-shrink:0;background:none;border:0;border-radius:8px;padding:9px 12px;min-height:40px;font-weight:700;color:var(--ink-2);position:relative}
.stafftabs button.on{background:var(--purple-soft);color:var(--purple-deep)}
.stafftabs .badge{display:inline-block;background:var(--bad);color:#fff;border-radius:99px;font-size:.75em;padding:0 6px;margin-left:5px;vertical-align:middle}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.filters select{min-height:42px;padding:6px 8px;border:1px solid var(--line-strong);border-radius:10px;background:var(--paper);font-size:.9em}
.trow{display:grid;grid-template-columns:62px 1fr auto;gap:4px 10px;width:100%;background:var(--paper);border:1px solid var(--line);border-left-width:6px;border-radius:10px;padding:10px 12px;margin-bottom:8px;text-align:left;align-items:center}
.trow.confirmed{border-left-color:var(--ok)}.trow.tentative{border-left-color:var(--warn)}.trow.moved{border-left-color:var(--moved)}.trow.cancelled{border-left-color:var(--bad)}
.trow .tt{font-weight:700;font-size:.9em}
.trow .tm{font-weight:700}
.trow .tw{color:var(--ink-2);font-size:.88em;grid-column:2}
.trow .ts{grid-column:3;grid-row:1/3;display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:.85em;color:var(--ink-2)}
.trow .dirty{color:var(--moved);font-weight:700;font-size:.8em}
.sheet{position:absolute;inset:0;z-index:25;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(30,15,45,.45)}
.sheet .panel{background:var(--canvas);border-radius:22px 22px 0 0;max-height:92%;display:flex;flex-direction:column}
.sheet .panel-head{padding:14px 16px 8px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.sheet .panel-body{overflow:auto;padding:4px 16px 16px}
.sheet .panel-foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;background:var(--paper)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.assign li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);min-height:48px}
.assign li:last-child{border:0}
.assign input[type=checkbox]{width:22px;height:22px;accent-color:var(--purple)}
.assign .leadpick{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:.85em;color:var(--ink-2)}
.assign .leadpick input{width:18px;height:18px;accent-color:#B58900}
.assign .st{color:var(--ink-3);font-size:.85em}
.preview{background:#F3F0F7;border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
.preview .bubble{background:var(--paper);border-radius:14px;padding:10px 12px;font-size:.95em;border:1px solid var(--line)}
.reach{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.reach div{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.reach b{display:block;font-size:1.4em;color:var(--purple-deep)}
.reach span{font-size:.8em;color:var(--ink-2)}
.report{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.report.flag{border-left:6px solid var(--warn)}
.report .rh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.report .rv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:.92em;margin-top:8px}
.report .rv dt{color:var(--ink-2)}.report .rv dd{margin:0}
.log li{padding:10px 0;border-bottom:1px solid var(--line);font-size:.92em}
.log li b{display:block}
.log li .at{color:var(--ink-3);font-size:.85em}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.stat .n{font-size:2em;font-weight:700;color:var(--purple-deep);line-height:1}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}
.bar span{display:block;height:100%;background:var(--purple)}
.plan li{margin:8px 0}
.callout{background:var(--purple-soft);border-radius:12px;padding:10px 14px;margin:10px 0;font-size:.92em;color:var(--purple-deep)}
.result{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.result code{font-family:inherit;font-weight:700;font-size:1.3em;letter-spacing:.15em;color:var(--purple-deep)}
.result .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

/* ---------- Part 2 styles ---------- */
.app-head{background:linear-gradient(135deg,#6A3496 0%,#5E2B86 55%,#4A2170 100%)}
.staff-head.app-head{background:linear-gradient(135deg,#4A2170,#2E1346)}
.head-l{min-width:0}
.head-r{display:flex;align-items:center;gap:8px;flex-shrink:0}
.bell{position:relative;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.bell-svg{width:20px;height:20px}
.bell .badge{position:absolute;top:-4px;right:-4px;background:#F2C94C;color:#2A1A00;border-radius:99px;font-size:.7em;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 5px;font-weight:700}
.tabs.six button{font-size:.68em;padding:7px 1px 8px;gap:2px;min-height:58px}
.tabs.six button .ico-svg{width:22px;height:22px}
.tabs.six .badge{right:calc(50% - 20px)}
.hero.next{background:linear-gradient(145deg,#6A3496,#3C1A5B);color:#fff;border:0;box-shadow:0 12px 28px rgba(60,26,91,.28)}
.hero.next .when{color:#E6DAF0}
.hero.next .sub2{color:#EFE6F5;margin-bottom:6px}
.hero.next .count{color:#FFF1C9;font-size:1.15em}
.btn-light{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.45);color:#fff}
.btn-light:hover{background:rgba(255,255,255,.24)}
.phone[data-contrast="high"] .hero.next{background:#3C1A5B}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 10px}
.card.roles div{margin-top:4px;color:var(--ink-2)}
.bills{margin-top:8px}
.bill{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid var(--line);gap:8px}
.notes{min-height:100px}
.notes.big{min-height:150px;font-size:1.05em}
.tl{list-style:none;padding:0;margin:0 0 6px;border-left:3px solid var(--line);margin-left:8px}
.tl li{position:relative;padding-left:18px;margin:0 0 6px}
.tl li::before{content:"";position:absolute;left:-9px;top:18px;width:14px;height:14px;border-radius:50%;background:var(--paper);border:3px solid var(--line-strong)}
.tl li.live::before{border-color:var(--moved);background:var(--moved)}
.tl li.done::before{border-color:var(--ok);background:var(--ok)}
.tl li.off::before{border-color:var(--bad)}
.tl li button{width:100%;display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;min-height:56px}
.tl li.live button{border-color:var(--moved)}
.tl li.off button{opacity:.65}
.tl .tl-t{font-weight:700;min-width:60px;flex-shrink:0;white-space:nowrap;font-size:.92em}
.tl .tl-b{flex:1;min-width:0;display:flex;flex-direction:column}
.actcard{display:flex;gap:14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.ring{flex-shrink:0;display:block}
.totals{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0 4px}
.totals div{background:var(--purple-soft);border-radius:12px;padding:10px 4px;text-align:center}
.totals b{display:block;font-size:1.3em;color:var(--purple-deep);line-height:1.1}
.totals span{font-size:.75em;color:var(--ink-2)}
.actrow{display:flex;gap:12px;align-items:center;width:100%;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;text-align:left;min-height:64px}
.actrow .kind{width:58px;flex-shrink:0;text-align:center;font-size:.78em;font-weight:700;background:var(--purple-soft);color:var(--purple-deep);border-radius:8px;padding:6px 4px}
.actrow.done .kind{background:var(--ok-soft);color:var(--ok);font-size:1.1em}
.actrow.done{opacity:.8}
.actrow .ab{display:flex;flex-direction:column;gap:2px;min-width:0}
.mode-head{background:linear-gradient(145deg,#4A2170,#2E1346);color:#fff;border-radius:18px;padding:16px;margin-top:4px}
.mode-title{font-size:1.5em;font-weight:700;line-height:1.15;margin:4px 0}
.askrow{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:14px;margin-bottom:8px;font-size:1.05em;min-height:64px}
.askrow input{width:26px;height:26px;margin-top:2px;flex-shrink:0;accent-color:var(--ok)}
.askrow.on{border-color:var(--ok);background:var(--ok-soft)}
.thread{display:flex;flex-direction:column;gap:10px;margin:8px 0 12px}
.msg{max-width:88%;align-self:flex-start}
.msg.mine{align-self:flex-end}
.msg .who{font-size:.78em;color:var(--ink-3);margin:0 4px 2px}
.msg .who span{margin-left:6px}
.msg .bubble{background:var(--paper);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:10px 12px}
.msg.mine .bubble{background:var(--purple);color:#fff;border-color:var(--purple);border-radius:16px 16px 4px 16px}
.msg.staff .bubble{background:#FFF1C9;color:#3A2A00;border-color:#EBD48A}
.msg.staff .who{color:#8A6400;font-weight:700}
.member{border:1px solid var(--line-strong);border-radius:99px;padding:6px 12px;background:var(--paper);font-size:.9em;margin:0 6px 6px 0;display:inline-block}
.member.lead{background:#FFF1C9;border-color:#EBD48A;font-weight:700}
.resrow{display:flex;gap:12px;width:100%;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;text-align:left;align-items:flex-start}
.resrow .rtype{flex-shrink:0;width:66px;text-align:center;font-size:.78em;font-weight:700;border:1px solid var(--line-strong);border-radius:8px;padding:5px 4px;color:var(--ink-2)}
.resrow .rb{display:flex;flex-direction:column;gap:2px;min-width:0}
.bus{background:var(--paper);border:1px solid var(--line);border-left:6px solid #F2C94C;border-radius:0 14px 14px 0;padding:10px 14px;margin:0 0 14px}
.boardrow{background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--line-strong);border-radius:12px;padding:10px 14px;margin-bottom:8px}
.boardrow.live{border-left-color:var(--moved)}.boardrow.done{border-left-color:var(--ok)}.boardrow.late{border-left-color:var(--warn);background:var(--warn-soft)}.boardrow.off{border-left-color:var(--bad);opacity:.7}
.boardrow .status{font-weight:700}
.phone[data-text="large"] .tabs.six button{font-size:.62em}

/* ---------- Part 3: visual pass and full-screen mode ---------- */
.app-head{position:relative;overflow:hidden;padding:16px 16px 14px}
.app-head::before,.app-head::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.07);pointer-events:none}
.app-head::before{width:220px;height:220px;right:-70px;top:-150px}
.app-head::after{width:120px;height:120px;left:40%;bottom:-90px;background:rgba(255,255,255,.05)}
.app-head .head-l,.app-head .head-r{position:relative}
.app-head .wordmark{font-size:1.15em;letter-spacing:-.01em}
.avatar{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.85em;color:#fff;flex-shrink:0;letter-spacing:.02em}
.avatar.sm{width:28px;height:28px;font-size:.7em}
.head-r .avatar{border:2px solid rgba(255,255,255,.55)}
.proto{font-size:.62em;padding:2px 8px}

.screen{animation:enter .26s ease-out both}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}}

/* hero */
.hero.next{position:relative;overflow:hidden;padding:18px}
.hero.next::after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-110px;bottom:-150px;background:radial-gradient(circle,rgba(255,241,201,.28),rgba(255,241,201,0) 65%);pointer-events:none}
.hero.next > *{position:relative}
.pulse{display:inline-block;width:9px;height:9px;border-radius:50%;background:#FFF1C9;margin-right:7px;box-shadow:0 0 0 0 rgba(255,241,201,.7);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,241,201,.7)}70%{box-shadow:0 0 0 9px rgba(255,241,201,0)}100%{box-shadow:0 0 0 0 rgba(255,241,201,0)}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.daychip{font-size:.78em;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:3px 10px}
.hero.next .big{font-size:2em}
.dayprog{margin-top:14px}
.dayprog .bar{height:8px;background:rgba(255,255,255,.2);margin:6px 0 0}
.dayprog .bar span{background:#FFF1C9}
.dayprog .tiny{color:#E6DAF0}

/* buttons */
.btn-primary{box-shadow:0 6px 16px rgba(94,43,134,.28)}
.btn:active{transform:translateY(1px)}

/* agenda type colors */
.rail .item .title::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:1px;background:var(--purple)}
.rail .item.breakout .title::before{background:#0F8B8D}
.rail .item.meal .title::before{background:#D9890C}
.rail .item.reception .title::before{background:#C2417A}
.rail .item.team .title::before{background:#2E7D4F}
.rail .block{background:#E0F3F3;color:#0A6567}
.chips button.on{box-shadow:0 6px 14px rgba(94,43,134,.25)}

/* meeting cards */
.meeting .body{display:flex;gap:12px;align-items:flex-start}
.meeting .bbadge{width:44px;height:44px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;font-size:1.05em;line-height:1;color:#fff;background:var(--purple)}
.meeting .bbadge small{font-size:.55em;font-weight:400;opacity:.9;margin-top:2px}
.meeting .bbadge.house{background:#1F5FA6}
.meeting .bbadge.senate{background:#5E2B86}
.meeting.cancelled .bbadge{background:var(--line-strong)}
.meeting .bodyin{flex:1;min-width:0}

/* tabs */
.tabs.six button.on::before{display:none}
.tabs.six button .ico-svg{width:46px;height:28px;padding:3px 12px;border-radius:14px;transition:background .15s}
.tabs.six button.on .ico-svg{background:var(--purple-soft)}
.tabs.six button.on{color:var(--purple-deep)}

/* team */
.member{display:inline-flex;align-items:center;gap:6px;padding:4px 12px 4px 4px}
.msg{display:flex;gap:8px;align-items:flex-end}
.msg.mine{flex-direction:row-reverse}
.msg .mbody{min-width:0}
.msg.mine .who{text-align:right}
.avatar.staff{background:#B58900}

/* confetti */
.confetti{position:absolute;top:-10px;width:9px;height:14px;border-radius:2px;z-index:40;pointer-events:none;animation:fall 1.5s ease-in forwards}
@keyframes fall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(560px) rotate(540deg);opacity:0}}

/* full-screen mode */
body.fs{background:#120D1A}
body.fs .demo{display:none;position:fixed;top:0;left:0;right:0;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.5);max-height:80vh;overflow:auto}
body.fs.fs-open .demo{display:flex}
body.fs .stage{padding:0}
body.fs .phone{max-height:none;height:100%;max-width:430px;border-radius:0;box-shadow:none}
@media (min-width:481px){body.fs .phone{border-radius:38px;border:10px solid #1C1522;box-shadow:0 30px 80px rgba(0,0,0,.6);max-height:calc(100% - 24px);margin:12px 0}}
body.fs .app-head{padding-top:42px}
.fs-handle{display:none;position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:150;background:rgba(20,14,28,.72);color:#E6EAF0;border:1px solid rgba(255,255,255,.25);border-radius:99px;padding:5px 12px;font-size:12px;backdrop-filter:blur(6px);min-height:26px;cursor:pointer}
body.fs .fs-handle{display:inline-flex;align-items:center;gap:6px}
body.fs.fs-open .fs-handle{display:none}
.demo .dbtn.fsbtn{background:#2E7D4F;border-color:#2E7D4F}

.proto-strip{background:var(--purple-deep);color:#E6DAF0;font-size:.68em;text-align:center;padding:2px 8px;letter-spacing:.02em;flex-shrink:0}
.phone[data-contrast="high"] .proto-strip{background:#000;color:#fff}
.push:not(.show){visibility:hidden}

/* ---------- Structural rules shared by every theme ---------- */
/* Rules that the app's render code depends on, written without any visual opinion. */
.grp{display:flex;gap:12px;align-items:center;width:100%;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;text-align:left;min-height:72px}
.grp .grp-t{font-weight:700;font-size:.95em;min-width:62px;flex-shrink:0;white-space:nowrap}
.grp .grp-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.grp .avs{display:flex;flex-shrink:0}
.grp .avs .avatar{margin-left:-8px;border:2px solid var(--paper)}
.grp .avs .avatar:first-child{margin-left:0}
.avatar.more{background:var(--ink);color:var(--paper)}
.leg{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.leg.tight{background:var(--warn-soft);margin:0 -8px;padding:12px 8px;border-radius:var(--radius)}
.leg .btn{flex-shrink:0}
.app-head .logo{height:58px;width:auto;display:block;object-fit:contain}
.app-head .sub{margin-top:5px}
.head-l{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.entry .logo-big{width:230px;max-width:70%;height:auto;display:block;margin:4px 0 14px}

/* ---------- Part 5: installable app layer ---------- */
@font-face{font-family:'Archivo';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/archivo-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Archivo';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/archivo-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Archivo';font-style:normal;font-weight:900;font-display:swap;src:url(fonts/archivo-latin-900-normal.woff2) format('woff2')}
html{-webkit-text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent}
button,a,input,select{touch-action:manipulation}
.screen{overscroll-behavior:contain}

/* App mode: launched from the Home Screen, or opened on a phone */
html.app{padding:0;height:100%;background:#4A0D66}
html.app body{height:100%;min-height:0;overflow:hidden;overscroll-behavior:none;background:#FFFFFF}
body.app .fs-handle{display:none!important}
body.app .stage{padding:0;flex:1;min-height:0}
body.app .phone{max-width:none;max-height:none;border-radius:0;box-shadow:none;border:0;margin:0}
body.app .app-head{padding-top:calc(env(safe-area-inset-top,0px) + 14px)}
body.app .push{top:calc(env(safe-area-inset-top,0px) + 8px)}
body.app .toast{bottom:calc(env(safe-area-inset-bottom,0px) + 84px)}
body.app [data-act="simlink"]{display:none}
body.app img,body.app button,body.app a{-webkit-touch-callout:none}
body.app .tabs,body.app .stafftabs,body.app .app-head,body.app .chips{-webkit-user-select:none;user-select:none}
body.app input,body.app select,body.app textarea{font-size:max(16px,1em)}
body.app .logo,body.app .logo-big{cursor:default}

/* Demo panel: hidden in app mode until the logo is tapped three times */
body.app .demo{display:none;position:fixed;left:0;right:0;top:0;z-index:300;max-height:88vh;overflow:auto;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 16px;border-bottom:4px solid #FFA400;box-shadow:0 18px 40px rgba(0,0,0,.45)}
body.app.demo-open .demo{display:flex}
body.app .demo [data-act="fullscreen"],body.app .demo [data-act="exitFs"],body.app .demo [data-act="fsToggle"],body.app .demo .collapse{display:none}
.demo .dbtn.go{background:#FFA400;border-color:#FFA400;color:#4A0D66;font-weight:700}
.demo a.dbtn{text-decoration:none;display:inline-flex;align-items:center}
.demo-scrim{display:none}
body.app.demo-open .demo-scrim{display:block;position:fixed;inset:0;z-index:299;background:rgba(20,10,30,.55)}

/* Launch screen (Home Screen launches only) */
#splash{display:none;position:fixed;inset:0;z-index:500;background:#4A0D66;align-items:center;justify-content:center;transition:opacity .35s ease}
#splash img{width:60%;max-width:300px;height:auto}
#splash.gone{opacity:0;pointer-events:none}
@media (display-mode:standalone){#splash{display:flex}}
@media (prefers-reduced-motion:reduce){#splash{transition:none}}

/* Simulated phone banner uses the real app icon */
.push .app-ico{background:#4A0D66 url(icons/icon-192.png) center/cover no-repeat;color:transparent;font-size:0}

/* Install card */
.install{background:#FFFFFF;border:2px solid #1A1A1A;border-left:8px solid var(--gold);border-radius:0 6px 6px 0;padding:10px 14px;margin:14px 0}
.install b{display:block;margin-bottom:2px}

/* Live Google map */
.gmap-slot{border:3px solid #1A1A1A;border-radius:6px;box-shadow:8px 8px 0 var(--gold);overflow:hidden;margin:10px 0 16px;height:min(46vh,380px);background:#E6E7E8}
.gmap{width:100%;height:100%}
.gpin{font-family:var(--font);background:#FFFFFF;color:#1A1A1A;border:2px solid #1A1A1A;border-radius:6px;padding:3px 7px;font-weight:900;font-size:11px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;box-shadow:2px 2px 0 rgba(0,0,0,.25)}
.gpin.mine{background:#4A0D66;color:#FFFFFF;border-color:#4A0D66;font-size:12px}
.gpin.mine b{color:#FFA400;margin-right:5px}
.gpin.capitol{background:#FFA400;color:#4A0D66;border-color:#4A0D66}
.gpin.hotel{background:#359A8E;color:#FFFFFF;border-color:#1F5A53}
.mapnote{font-size:.88em;color:var(--ink-2);font-weight:500;margin:4px 0 8px}

/* ---------- Theme: Wayfinder ---------- */
/* Wayfinder: each section owns a color, and the header, active tab and
   selected chips take it on, so a volunteer always knows where they are.
   Warm paper canvas, big rounded shapes, tactile two-tone buttons. */
:root{
  --font:'Archivo',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --purple:#4A0D66; --purple-deep:#37094C; --purple-soft:#EFE4F6; --purple-tint:#F8F3FB;
  --ink:#1C1A22; --ink-2:#5A5663; --ink-3:#7E7987; --line:#E9E5EC; --line-strong:#C9C3CF;
  --paper:#FFFFFF; --canvas:#F6F4F0;
  --ok:#1E7A4C; --ok-soft:#DDF3E6; --warn:#8A5300; --warn-soft:#FFEFC2;
  --moved:#1D4F9E; --moved-soft:#E1EBFA; --bad:#B42318; --bad-soft:#FBE4E1;
  --teal:#0F6E66; --gold:#FFA400; --focus:#1D4F9E; --radius:20px;
  --section:#4A0D66; --section-soft:#EFE4F6; --section-ink:#FFFFFF;
  --page-bg:#DDD7E2; --demo-bg:#1C2431;
  --lift:0 1px 0 var(--line),0 8px 22px rgba(28,26,34,.07);
}
body{font-family:var(--font)}
.phone{background:var(--canvas);box-shadow:0 30px 70px rgba(28,26,34,.28),0 0 0 1px rgba(28,26,34,.06)}

/* Section colors follow the active tab */
#pc:has(.tabs button.on[data-arg="agenda"]){--section:#0F6E66;--section-soft:#DCF0ED}
#pc:has(.tabs button.on[data-arg="meetings"]){--section:#1D3F73;--section-soft:#E0E8F5}
#pc:has(.tabs button.on[data-arg="act"]){--section:#B5451B;--section-soft:#FCE6DB}
#pc:has(.tabs button.on[data-arg="team"]){--section:#1F6B3A;--section-soft:#DEF1E4}
#pc:has(.tabs button.on[data-arg="more"]){--section:#3E3A4D;--section-soft:#E8E6EE}

.screen{padding-top:14px}
.screen h1{font-size:1.9em;font-weight:900;letter-spacing:-.03em;line-height:1.02;color:var(--section);text-wrap:balance}
.screen h2{font-size:1.05em;font-weight:900;letter-spacing:-.01em;margin:26px 0 10px;display:flex;align-items:center;gap:8px}
.screen h2::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--section);flex-shrink:0}
.changes h2::before,.detail-head h2::before{display:none}
.lede{font-weight:500}
.tiny,.muted,.small{font-weight:500}

/* header and chrome */
.app-head,.staff-head.app-head{background:var(--section);color:var(--section-ink);padding:16px 18px 20px;border-radius:0 0 26px 26px;transition:background .3s ease}
@media (prefers-reduced-motion:reduce){.app-head{transition:none}}
.app-head::before{display:block;width:260px;height:260px;right:-90px;top:-170px;background:rgba(255,255,255,.08)}
.app-head::after{display:none}
.app-head .logo{height:56px}
.app-head .sub{color:rgba(255,255,255,.88);font-weight:700;font-size:.68em;letter-spacing:.14em;text-transform:uppercase;margin-top:5px}
.staff-head.app-head{background:#2B2733}
.bell{border:0;background:rgba(255,255,255,.18);color:#fff;width:42px;height:42px;border-radius:14px}
.bell .badge{background:var(--gold);color:#2A1A00}
.head-r .avatar{border:0;box-shadow:0 0 0 3px rgba(255,255,255,.5);border-radius:14px}
.avatar{border-radius:12px}
.avatar.sm{border-radius:9px}
.proto-strip{background:transparent;color:var(--ink-3);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.6em;padding:8px 8px 0}
.offline-banner{background:#1C1A22;border-radius:14px;margin:10px 16px 0}

/* buttons and inputs: pressable, with a bottom edge */
.btn{border-radius:16px;border:0;border-bottom:4px solid rgba(28,26,34,.16);background:var(--paper);color:var(--ink);font-weight:700;min-height:50px;box-shadow:0 1px 0 var(--line);padding-bottom:9px}
.btn:hover{background:var(--purple-tint)}
.btn-primary{background:var(--purple);border-bottom-color:#25053A;color:#fff;box-shadow:none}
.btn-primary:hover{background:var(--purple-deep)}
.btn-ghost{background:transparent;border-bottom-color:transparent;color:var(--purple);box-shadow:none}
.btn-light{background:rgba(255,255,255,.18);border-bottom-color:rgba(0,0,0,.25);color:#fff;box-shadow:none}
.btn-light:hover{background:rgba(255,255,255,.28)}
.btn-danger{color:var(--bad);background:var(--bad-soft);border-bottom-color:rgba(180,35,24,.3)}
.btn-sm{border-radius:12px;min-height:40px;border-bottom-width:3px;padding-bottom:7px}
.btn:active{transform:translateY(3px);border-bottom-width:1px;padding-bottom:12px}
.btn-sm:active{padding-bottom:9px}
.back{color:var(--section);font-weight:900}
.link{color:var(--purple);text-decoration:none;border-bottom:2px solid var(--gold);padding-bottom:0;font-weight:900}
.input,select.input,textarea.input{border:2px solid var(--line-strong);border-radius:16px;background:#fff}
.input:focus,select.input:focus,textarea.input:focus{border-color:var(--purple);outline:none;box-shadow:0 0 0 4px var(--purple-soft)}
.code-input{border-color:var(--purple);letter-spacing:.25em}
.radios label{border:2px solid var(--line);border-radius:14px;background:#fff;font-weight:700}
.radios label:has(input:checked){background:var(--purple-soft);border-color:var(--purple)}
.chips button{border:2px solid var(--line);background:#fff;border-radius:14px;font-weight:700;color:var(--ink)}
.chips button.on{background:var(--section);border-color:var(--section);color:#fff;box-shadow:none}
.chips.sub button{border-radius:12px}
.chips.sub button.on{background:var(--section-soft);color:var(--ink);border-color:var(--section);font-weight:700}
.switch input{background:#D3CDD8}
.switch input:checked{background:var(--ok)}
.filters select{border:2px solid var(--line-strong);border-radius:12px;font-weight:700}

/* pills */
.pill{border-radius:8px;text-transform:uppercase;font-size:.7em;letter-spacing:.06em;font-weight:900;padding:4px 8px}
.pill.lead{background:var(--gold);color:#2A1A00}

/* home */
.hero.next{background:var(--section);color:#fff;border:0;border-radius:24px;box-shadow:0 14px 30px rgba(28,26,34,.18);padding:20px;transition:background .3s ease}
.hero.next::after{background:radial-gradient(circle,rgba(255,255,255,.18),rgba(255,255,255,0) 65%)}
.hero.next .when{color:rgba(255,255,255,.85);font-weight:900;font-size:.74em;letter-spacing:.14em;text-transform:uppercase}
.pulse{background:var(--gold);box-shadow:0 0 0 0 rgba(255,164,0,.6)}
.daychip{background:rgba(255,255,255,.18);border:0;font-weight:900;border-radius:8px;text-transform:uppercase;font-size:.7em;letter-spacing:.06em}
.hero.next .big{font-size:1.95em;font-weight:900;letter-spacing:-.03em;line-height:1.02}
.hero.next .sub2{color:rgba(255,255,255,.9)}
.hero.next .count{display:inline-block;background:var(--gold);color:#2A1A00;border-radius:10px;padding:5px 10px;font-size:.92em;margin-top:6px;font-weight:900;font-variant-numeric:tabular-nums}
.dayprog .bar{background:rgba(255,255,255,.22);border-radius:99px;height:10px}
.dayprog .bar span{background:var(--gold);border-radius:99px}
.dayprog .tiny{color:rgba(255,255,255,.9)}
.changes{border-left:0;border-radius:var(--radius);background:var(--moved-soft);padding:14px 16px;box-shadow:inset 0 0 0 2px rgba(29,79,158,.25)}
.changes.none{background:var(--ok-soft);box-shadow:inset 0 0 0 2px rgba(30,122,76,.25)}
.changes h2{font-size:1em;margin:0 0 6px}
.bus{border:0;border-radius:var(--radius);background:#FFF4D6;box-shadow:inset 0 0 0 2px rgba(255,164,0,.5)}
.callout{background:var(--section-soft);color:var(--ink);border-radius:var(--radius);box-shadow:inset 0 0 0 2px var(--section)}
.quick .btn{min-height:70px;border-radius:var(--radius);padding:14px 16px 11px}
.quick .btn small{font-weight:500}

/* cards and lists */
.card,.contact,.announce,.report,.stat,.result,.menu button,.resrow,.actrow,.detail-head,.meeting,.grp,.actcard,.tl li button,details.prep,.mapwrap,.install,.reach div,.trow,.boardrow,.preview,.phone-mock{border:0;box-shadow:var(--lift);border-radius:var(--radius)}
.menu button{padding:16px 18px;min-height:64px;font-weight:900}
.menu button::after{color:var(--section);font-weight:900}
.meeting .strip{width:12px}
.meeting .bbadge{border-radius:12px;font-weight:900}
.meeting .bbadge.house{background:#1D3F73}
.meeting .bbadge.senate{background:var(--purple)}
.meeting .time{font-size:1.12em;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.warnrow{border:0;background:var(--warn-soft);border-radius:16px;color:#5A3200;box-shadow:inset 0 0 0 2px rgba(255,164,0,.6)}
.detail-head{padding:18px;box-shadow:var(--lift),inset 0 6px 0 var(--section)}
.detail-head .time{font-weight:900;letter-spacing:-.02em}
.detail-head h1{font-size:1.45em;color:var(--ink)}
.tl{border-left:3px solid var(--line-strong)}
.tl li.live::before{background:var(--section);border-color:var(--section)}
.tl li.live button{box-shadow:var(--lift),inset 0 0 0 2px var(--section)}
.tl .tl-t{font-weight:900;color:var(--section)}
.trow,.boardrow{border-left:8px solid var(--line-strong)}
.trow.confirmed{border-left-color:var(--ok)}.trow.tentative{border-left-color:var(--warn)}.trow.moved{border-left-color:var(--moved)}.trow.cancelled{border-left-color:var(--bad)}
.boardrow.live{border-left-color:var(--moved)}.boardrow.done{border-left-color:var(--ok)}.boardrow.late{border-left-color:var(--warn)}.boardrow.off{border-left-color:var(--bad)}
.rail .t{color:var(--section);font-weight:900;font-variant-numeric:tabular-nums}
.rail .title{font-weight:900}
.rail .item .title::before{border-radius:3px}
.rail .item.general{background:var(--section-soft);border-radius:14px;margin-left:-10px;padding-left:10px;padding-right:8px}
.rail .block{background:var(--gold);color:#2A1A00;font-weight:900;text-transform:uppercase;font-size:.68em;letter-spacing:.06em;border-radius:6px}
.star.on{color:var(--gold)}
.ph{border:2px dashed var(--line-strong);border-radius:14px;background:transparent;font-style:normal}
.askrow{border:2px solid var(--line);border-radius:var(--radius);box-shadow:var(--lift)}
.askrow.on{border-color:var(--ok)}
.mode-head{background:var(--purple);border-radius:24px}
.mode-title{font-weight:900;letter-spacing:-.02em}
.steps span{border-radius:99px;height:8px}
.steps span.on{background:var(--section)}
.err{border-left:0;border-radius:14px;background:var(--bad-soft);box-shadow:inset 0 0 0 2px rgba(180,35,24,.35)}
.empty{border:2px dashed var(--line-strong);border-radius:var(--radius)}
.totals div{background:var(--section-soft);border-radius:14px}
.totals b{color:var(--section);font-weight:900;font-variant-numeric:tabular-nums}
.totals span{font-weight:700}
.actrow .kind{background:var(--section);color:#fff;border-radius:10px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;font-size:.72em}
.actrow.done .kind{background:var(--ok-soft);color:var(--ok)}
.ring circle:nth-child(2){stroke:var(--section)}
.grp .grp-t{color:var(--section);font-weight:900}
.member{border-radius:12px;border:2px solid var(--line);font-weight:700}
.member.lead{background:var(--gold);border-color:var(--gold);color:#2A1A00}
.msg .bubble{border:0;box-shadow:var(--lift);border-radius:18px 18px 18px 6px}
.msg.mine .bubble{background:var(--purple);border-radius:18px 18px 6px 18px}
.msg.staff .bubble{background:#FFF4D6;color:#3A2A00}
.history{border-left-color:var(--section)}
.sheet{background:rgba(28,26,34,.45)}
.sheet .panel{border-radius:26px 26px 0 0}
.leg.tight{border-radius:14px}
.push{border-radius:20px}
.toast{border-radius:14px;font-weight:700}
.reach b,.stat .n,.result code{color:var(--section);font-weight:900}
.notif .ico{border-radius:14px}
.notif.unread .nt::before{background:var(--section)}

/* tabs: the active section lights up in its own color */
.tabs,.tabs.six{border-top:0;background:#fff;box-shadow:0 -1px 0 var(--line)}
.tabs.six button{color:var(--ink-2);font-weight:900;font-size:.64em;letter-spacing:.04em;text-transform:uppercase;transition:color .2s}
.tabs.six button.on{color:var(--section)}
.tabs.six button .ico-svg{border-radius:99px;width:56px;height:32px;padding:5px 17px;transition:background .2s,color .2s}
.tabs.six button.on .ico-svg{background:var(--section);color:#fff}
.tabs .badge{border-radius:8px}

/* staff */
.stafftabs{background:#fff;border-bottom:2px solid var(--line)}
.stafftabs button{border-radius:12px;font-weight:900;text-transform:uppercase;font-size:.76em;letter-spacing:.04em}
.stafftabs button.on{background:#2B2733;color:#fff}
.stafftabs .badge{background:var(--gold);color:#2A1A00;border-radius:6px}
.bar{border-radius:99px;background:var(--line)}
.bar span{background:var(--section);border-radius:99px}

/* entry */
.entry .mark{font-size:.8em;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--purple)}
.entry h1{font-size:2.1em;color:var(--purple)}

/* install layer and live map */
.install{border-left:0;background:var(--purple-soft);box-shadow:inset 0 0 0 2px var(--purple)}
.gmap-slot{border:0;border-radius:var(--radius);box-shadow:var(--lift)}
.gpin{border:2px solid var(--ink);border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.2);font-weight:900;text-transform:none;letter-spacing:0;font-size:12px;padding:3px 8px}
.gpin.mine{background:var(--purple);color:#fff;border-color:var(--purple)}
.gpin.capitol{background:var(--gold);color:#2A1A00;border-color:#2A1A00}
.gpin.hotel{background:var(--teal);color:#fff;border-color:var(--teal)}
.phone[data-contrast="high"]{--section-soft:#fff;--line:#777;--line-strong:#444;--canvas:#fff;--purple-soft:#E6DBF0;--lift:0 0 0 2px #1C1A22}
.phone[data-contrast="high"] .screen h1{color:#000}

</style>

  const s = secondsUntil(day, start);

  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;

  if (patch.start && (patch.start !== m.start || patch.end !== m.end)) {
    fields.time = { from: range(m), to: range(patch) };
    parts.push(`time moved from ${fmtTime(m.start)} to ${fmtTime(patch.start)}`);
    m.start = patch.start; m.end = patch.end;
  }
  if ((patch.building && patch.building !== m.building) || (patch.room != null && patch.room !== m.room)) {
    const from = `${m.building} ${m.room}`, to = `${patch.building || m.building} ${patch.room != null ? patch.room : m.room}`;
    fields.room = { from, to }; parts.push(`room changed from ${from} to ${to}`);
    if (patch.building) m.building = patch.building; if (patch.room != null) m.room = patch.room;
  }
  if (patch.status && patch.status !== m.status) {
    fields.status = { from: m.status, to: patch.status }; parts.push(`status changed from ${m.status} to ${patch.status}`); m.status = patch.status;
  } else if ((fields.time || fields.room) && m.status !== 'cancelled' && m.status !== 'tentative') {
    if (m.status !== 'moved') { fields.status = { from: m.status, to: 'moved' }; m.status = 'moved'; }
  }
  if (patch.note != null && patch.note !== m.note) { m.note = patch.note; parts.push('note updated'); }
  if (patch.staffer != null && patch.staffer !== m.staffer) { m.staffer = patch.staffer; parts.push('staffer updated'); }
  if (!parts.length) return false;
  const summary = parts.join('; ');
  const cap = summary.charAt(0).toUpperCase() + summary.slice(1);
  m.history.push({ at: nowLabel(), by, summary: cap, fields });
  live.changeLog.push({ at: nowLabel(), by, what: `${cap} for ${m.member} (${m.state})`, meetingId: id });
  live.lastUpdated = nowLabel();
  if (!live.pending.includes(id)) live.pending.push(id);
  return true;
}

function applyAssignments(id, list, by) {
  const m = live.meetings.find(x => x.id === id); if (!m) return false;
  const before = m.assignments.map(x => x.attendeeId), after = list.map(x => x.attendeeId);
  const added = after.filter(x => !before.includes(x)).map(x => attendee(x).name);
  const removed = before.filter(x => !after.includes(x)).map(x => attendee(x).name);
  const oldLead = leadOf(m), newLeadA = list.find(x => x.lead), newLead = newLeadA ? attendee(newLeadA.attendeeId) : null;
  const parts = [];
  if (added.length) parts.push('added ' + added.join(', '));
  if (removed.length) parts.push('removed ' + removed.join(', '));
  if ((oldLead && oldLead.id) !== (newLead && newLead.id)) parts.push('team lead is now ' + (newLead ? newLead.name : 'unassigned'));
  if (!parts.length) return false;
  m.assignments = list;
  const what = `Team updated for ${m.member} (${m.state}): ${parts.join('; ')}`;
  live.changeLog.push({ at: nowLabel(), by, what, meetingId: id });
  live.lastUpdated = nowLabel();
  if (!live.pending.includes(id)) live.pending.push(id);
  return true;
}

function defaultMessage(m) {
  const last = m.history[m.history.length - 1];
  const note = m.note ? ' ' + m.note : '';
  if (m.status === 'cancelled') return `Schedule update: your ${fmtTime(m.start)} meeting with ${m.member} has been cancelled.${note} Open the app for details.`;
  if (last && last.fields.time) return `Schedule update: your meeting with ${m.member} is now ${fmtTime(m.start)} in ${m.building} ${m.room}.${note} Open the app for details.`;
  if (last && last.fields.room) return `Schedule update: your ${fmtTime(m.start)} meeting with ${m.member} is now in ${m.building} ${m.room}.${note} Open the app for details.`;
  return `Schedule update: details changed for your ${fmtTime(m.start)} meeting with ${m.member}. Open the app for details.`;
}
function notifTitle(m) { return m.status === 'cancelled' ? 'Meeting cancelled' : (m.history.length && m.history[m.history.length - 1].fields.time ? 'Meeting moved' : 'Meeting updated'); }

function sendNotifications(id, message, by) {
  const m = live.meetings.find(x => x.id === id); if (!m) return;
  const people = m.assignments.map(x => attendee(x.attendeeId));
  const pushN = people.filter(p => p.pushOptIn).length;
  const title = notifTitle(m);
  people.forEach(p => live.notifications[p.id].push({ id: uid(), at: nowLabel(), type: 'change', meetingId: id, title, body: message, read: false }));
  live.changeLog.push({ at: nowLabel(), by, what: `Notified ${people.length} attendees about ${m.member} (${m.state}): ${pushN} push, ${people.length} text`, meetingId: id });
  live.pending = live.pending.filter(x => x !== id);
  const meAffected = people.some(p => p.id === state.attendeeId);
  const me = attendee(state.attendeeId);
  if (meAffected && !state.offline) {
    if (state.view === 'attendee') { showPush(title, message, id); setTimeout(() => showToast(`A text message with the same update would also go to all ${people.length} team members.`), 900); }
    else { state.queuedBanner = { title, message, id }; showToast(`Sent to ${people.length}: ${pushN} push, ${people.length} text. Switch to Attendee view to see ${firstName(me)}'s push banner.`); }
  } else if (meAffected && state.offline) {
    showToast(`Sent to ${people.length}: ${pushN} push, ${people.length} text. ${firstName(me)}'s phone is offline, so the alert will arrive when it reconnects.`);
  } else {
    showToast(`Sent to ${people.length} attendees: ${pushN} push, ${people.length} text.`);
  }
}

function sendAnnouncement(title, body, by) {
  const a = { id: uid(), at: nowLabel(), title, body };
  live.announcements.push(a);
  live.attendees.forEach(p => live.notifications[p.id].push({ id: uid(), at: nowLabel(), type: 'announcement', title, body, read: false }));
  live.changeLog.push({ at: nowLabel(), by, what: `Sent announcement: ${title}` });
  live.lastUpdated = nowLabel();
  if (state.attendeeId && !state.offline) {
    if (state.view === 'attendee') showPush(title, body); else state.queuedBanner = { title, message: body };
  }
}

function simulateChange() {
  const assigned = state.attendeeId ? live.meetings.filter(m => m.status !== 'cancelled' && m.assignments.some(x => x.attendeeId === state.attendeeId)) : [];
  const pool = assigned.length ? assigned : live.meetings.filter(m => m.status !== 'cancelled');
  if (!pool.length) { showToast('Nothing left to change. Reset the demo data first.'); return; }
  const m = pool[Math.floor(Math.random() * pool.length)];
  const roll = Math.random();
  let patch;
  if (roll < 0.5) { const s = toMin(m.start) + 30; patch = { start: minToT(s), end: minToT(s + 30) }; }
  else if (roll < 0.8) { const rooms = ['509', '216', '2358', '1302', '428', '144']; patch = { room: rooms[Math.floor(Math.random() * rooms.length)], note: 'Office switched rooms this morning. Same building.' }; }
  else { patch = { status: 'cancelled', note: 'Office cancelled because of a committee markup. Staff are working to reschedule.' }; }
  applyEdit(m.id, patch, 'Scheduler (demo)');
  sendNotifications(m.id, defaultMessage(m), 'Scheduler (demo)');
  render();
}

function toggleOffline() {
  state.offline = !state.offline;
  if (state.offline) { snapshot = deepCopy(live); }
  else {
    snapshot = null;
    if (state.outbox.length) { state.outbox.forEach(r => live.reports.push(r)); showToast(`Back online. ${state.outbox.length} saved report${state.outbox.length > 1 ? 's' : ''} sent.`); state.outbox = []; }

  }
  render();
}

function warnBetween(a, b) {
  if (a.status === 'cancelled' || b.status === 'cancelled') return '';
  if (a.building === b.building) return '';
  const gap = toMin(b.start) - toMin(a.end); const walk = walkMinutes(a.building, b.building);
  if (gap > walk + 10) return '';
  const tight = gap < walk;
  return `<div class="warnrow" role="note"><span class="ico" aria-hidden="true">&#9888;</span><div><b>${tight ? 'Tight connection.' : 'Heads up.'}</b> ${gap} minutes between ${esc(a.building)} and ${esc(b.building)}. Walking takes about ${walk} minutes (approximate). ${tight ? 'Tell your team lead if you think you will be late.' : 'Leave as soon as the first meeting ends.'} <button class="link" data-act="go" data-arg="map">See map</button></div></div>`;
}

  const lead = leadOf(m); const rep = reportFor(id);

      <button class="btn btn-sm" data-act="go" data-arg="map">Find ${esc(m.building)} on the map</button>`}
    </div>
    ${m.note && m.status !== 'cancelled' ? `<div class="callout"><b>Note from staff:</b> ${esc(m.note)}</div>` : ''}
    ${m.history.length ? `<h2>What changed</h2><ul class="history">${m.history.slice().reverse().map(hh => `<li><b>${esc(hh.summary)}.</b> <span class="tiny">${esc(hh.at)}</span></li>`).join('')}</ul>` : ''}
    <h2>Your team (${team.length})</h2>
    <ul class="team" style="list-style:none;padding:0;margin:0">${team.map(p => `<li><span>${esc(p.name)}${p.id === state.attendeeId ? '<span class="you">you</span>' : ''}<br><span class="tiny">${esc(p.city)}, ${p.state}</span></span>${isLead(m, p.id) ? '<span class="pill lead">Team lead</span>' : ''}</li>`).join('')}</ul>
    <h2>Prepare</h2>
    <details class="prep"><summary>About ${esc(m.member.split(' ').slice(1).join(' '))}</summary><div class="inner"><p>${esc(m.profile)}</p><p class="tiny">Fictional profile for the prototype.</p></div></details>
    <details class="prep"><summary>Our asks and talking points</summary><div class="inner"><ol style="padding-left:18px;margin:4px 0">${SEED.prep.asks.map(a => `<li>${esc(a)}</li>`).join('')}</ol><p class="tiny">Placeholder text. Final asks come from the policy team.</p></div></details>
    <details class="prep"><summary>Leave-behind</summary><div class="inner"><div class="ph">One-page leave-behind PDF goes here. Your team lead carries printed copies.</div></div></details>
    <details class="prep"><summary>Quick meeting tips</summary><div class="inner"><ul style="padding-left:18px;margin:4px 0">${SEED.prep.tips.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div></details>
    <h2>After the meeting</h2>

function mapScreen() {
  const mine = myMeetings().filter(m => m.status !== 'cancelled');
  const used = new Set(mine.map(m => m.building));
  const B = CONFIG.buildings;
  const box = (name, y) => { const b = B[name]; const on = used.has(name); return `<g><rect x="${b.x - 55}" y="${y}" width="110" height="52" rx="8" fill="${on ? 'var(--purple)' : 'var(--purple-soft)'}" stroke="${on ? 'var(--purple-deep)' : 'var(--line-strong)'}"/><text x="${b.x}" y="${y + 31}" text-anchor="middle" font-size="15" font-weight="700" fill="${on ? '#fff' : 'var(--ink)'}" font-family="inherit">${name}</text></g>`; };
  const svg = `<svg viewBox="0 0 400 330" role="img" aria-label="Schematic of House and Senate office buildings around the Capitol">
    <text x="200" y="22" text-anchor="middle" font-size="13" fill="var(--ink-3)" font-family="inherit">Senate side (north)</text>
    ${['Russell', 'Dirksen', 'Hart'].map(n => box(n, 32)).join('')}
    <text x="200" y="108" text-anchor="middle" font-size="12" fill="var(--ink-3)" font-family="inherit">Constitution Ave</text>
    <rect x="130" y="122" width="140" height="78" rx="10" fill="var(--paper)" stroke="var(--line-strong)" stroke-dasharray="4 3"/>
    <text x="200" y="156" text-anchor="middle" font-size="15" fill="var(--ink-2)" font-family="inherit">U.S. Capitol</text>
    <text x="200" y="176" text-anchor="middle" font-size="11" fill="var(--ink-3)" font-family="inherit">(about 20 min to cross)</text>
    <text x="200" y="222" text-anchor="middle" font-size="12" fill="var(--ink-3)" font-family="inherit">Independence Ave</text>
    ${['Cannon', 'Longworth', 'Rayburn'].map(n => box(n, 236)).join('')}
    <text x="200" y="316" text-anchor="middle" font-size="13" fill="var(--ink-3)" font-family="inherit">House side (south)</text></svg>`;
  let walks = '';
  for (let i = 0; i < mine.length - 1; i++) {
    const a = mine[i], b = mine[i + 1]; const gap = toMin(b.start) - toMin(a.end); const w = walkMinutes(a.building, b.building);
    walks += `<div class="walk"><span>${esc(a.building)} ${esc(a.room)}<br><span class="tiny">ends ${fmtTime(a.end)}</span></span><span class="arrow">to</span><span>${esc(b.building)} ${esc(b.room)}<br><span class="tiny">starts ${fmtTime(b.start)}</span></span><span class="mins ${gap < w ? 'tight' : ''}">${w === 0 ? 'Same building' : `about ${w} min`}<br><span class="tiny" style="font-weight:400">${gap} min gap</span></span></div>`;
  }
  return `<button class="back" data-act="tab" data-arg="meetings">&#8249; My meetings</button>
    <h1>Building map</h1><p class="lede">Not to scale. Your meeting buildings are shaded purple.</p>
    <div class="mapwrap">${svg}</div>
    <p class="tiny">Walking times are rough estimates and do not include security lines. Tunnels connect buildings on the same side.</p>
    ${mine.length > 1 ? `<h2>Between your meetings</h2>${walks}` : ''}`;
}

function alertsScreen() {

    <div class="phone-mock"><div class="ios" aria-hidden="true"><span style="font-size:1.3em">&#8862;</span> Add to Home Screen</div><p class="tiny">You may need to scroll to find it</p></div>

    <div class="phone-mock"><b>"${esc(CONFIG.eventName)}" Would Like to Send You Notifications</b><p class="tiny" style="margin:6px 0">Notifications may include alerts, sounds, and icon badges.</p><div class="allow" aria-hidden="true"><span>Don't Allow</span><span>Allow</span></div></div>
    <button class="btn btn-primary btn-block" data-act="optin">Simulate tapping Allow</button>

function staffShell() {
  const tabs = [['meetings', 'Meetings'], ['notify', 'Notify'], ['reports', 'Reports'], ['announce', 'Announce'], ['helpdesk', 'Help desk'], ['log', 'Change log'], ['stats', 'Opt-in'], ['plan', 'How this would work']];
  const pending = live.pending.length;
  const screens = { meetings: staffMeetings, notify: staffNotify, reports: staffReports, announce: staffAnnounce, helpdesk: staffHelpdesk, log: staffLog, stats: staffStats, plan: staffPlan };
  return appHead(true) + `<nav class="stafftabs" aria-label="Staff sections">${tabs.map(([id, l]) => `<button class="${state.staffTab === id ? 'on' : ''}" data-act="stafftab" data-arg="${id}">${l}${id === 'notify' && pending ? `<span class="badge">${pending}</span>` : ''}</button>`).join('')}</nav>
    <div class="screen" id="screen">${(screens[state.staffTab] || staffMeetings)()}</div>
    ${state.editing ? editSheet(state.editing) : ''}`;

function staffMeetings() {
  const f = state.filters;
  const sel = (key, label, opts) => `<select data-change="filter" data-key="${key}" aria-label="${label}"><option value="">${label}: all</option>${opts.map(o => `<option value="${o}" ${f[key] === o ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
  let rows = live.meetings.slice().sort((a, b) => toMin(a.start) - toMin(b.start));
  if (f.state) rows = rows.filter(m => m.state === f.state);
  if (f.status) rows = rows.filter(m => m.status === f.status.toLowerCase());
  if (f.building) rows = rows.filter(m => m.building === f.building);
  if (f.time) rows = rows.filter(m => f.time === 'Morning' ? toMin(m.start) < 720 : toMin(m.start) >= 720);
  return `<h1>Meetings</h1><p class="lede">${esc(dayInfo(CONFIG.meetingDay).long)}. ${live.meetings.length} meetings, ${live.attendees.length} attendees. Tap a meeting to edit it. One edit updates everyone on that team.</p>
    <div class="filters">${sel('state', 'State', ['OH', 'CO', 'GA'])}${sel('status', 'Status', ['Confirmed', 'Tentative', 'Moved', 'Cancelled'])}${sel('building', 'Building', Object.keys(CONFIG.buildings))}${sel('time', 'Time', ['Morning', 'Afternoon'])}</div>
    ${rows.length ? rows.map(m => `<button class="trow ${m.status}" data-act="edit" data-arg="${m.id}">
        <span class="tt">${fmtTime(m.start)}<br><span class="tiny">${esc(m.state)}</span></span>
        <span class="tm">${esc(m.member)}</span>
        <span class="tw">${esc(m.building)} ${esc(m.room)}. ${m.assignments.length} on team${leadOf(m) ? ', lead ' + esc(firstName(leadOf(m))) : ', no lead'}</span>
        <span class="ts">${pill(m.status)}${live.pending.includes(m.id) ? '<span class="dirty">Unsent change</span>' : ''}</span>
      </button>`).join('') : `<div class="empty"><b>No meetings match</b>Clear a filter to see more.</div>`}
    <p class="tiny">Last updated ${esc(live.lastUpdated)}. Pending notifications: ${live.pending.length}.</p>`;
}

function editSheet(id) {

      </div>
      <div class="two">
        <label class="field"><span>Building</span><select id="e-building" class="input">${Object.keys(CONFIG.buildings).map(b => `<option ${b === m.building ? 'selected' : ''}>${b}</option>`).join('')}</select></label>
        <label class="field"><span>Room</span><input id="e-room" class="input" value="${esc(m.room)}"></label>
      </div>
      <label class="field"><span>Status</span><select id="e-status" class="input">${['confirmed', 'tentative', 'moved', 'cancelled'].map(s => `<option value="${s}" ${s === m.status ? 'selected' : ''}>${statusLabel(s)}</option>`).join('')}</select></label>

      <ul class="assign" style="list-style:none;padding:0;margin:0">${byState.map(a => { const as = m.assignments.find(x => x.attendeeId === a.id); return `<li><input type="checkbox" class="e-assign" value="${a.id}" id="as-${a.id}" ${as ? 'checked' : ''}><label for="as-${a.id}">${esc(a.name)} <span class="st">${a.state}</span></label><label class="leadpick"><input type="radio" name="e-lead" value="${a.id}" ${lead && lead.id === a.id ? 'checked' : ''}>lead</label></li>`; }).join('')}</ul>
      ${m.history.length ? `<h3>Change history</h3><ul class="history">${m.history.slice().reverse().map(hh => `<li>${esc(hh.summary)} <span class="tiny">${esc(hh.at)}, ${esc(hh.by)}</span></li>`).join('')}</ul>` : ''}
    </div>
    <div class="panel-foot"><button class="btn" data-act="closeSheet">Cancel</button><button class="btn btn-primary" style="flex:1" data-act="save" data-arg="${id}">Save changes</button></div>
  </div></div>`;
}

function readSheet() {
  const assigned = [...document.querySelectorAll('.e-assign:checked')].map(x => x.value);
  const leadEl = document.querySelector('input[name=e-lead]:checked'); const leadId = leadEl ? leadEl.value : null;
  const list = assigned.map(id => ({ attendeeId: id, lead: id === leadId }));
  if (leadId && !assigned.includes(leadId)) list.push({ attendeeId: leadId, lead: true });
  return {

}

/* ---------- stepped report ---------- */
function draftFor(id) {
  if (state.reportDraft && state.reportDraft.meetingId === id) return state.reportDraft;
  const ex = reportFor(id); const m = live.meetings.find(x => x.id === id);
  state.reportDraft = ex ? deepCopy(ex) : { meetingId: id, attendeeId: state.attendeeId, went: '', metWith: m.staffer, memberJoined: '', asks: {}, commitment: '', followUp: false, followUpWhat: '', notes: noteFor(id), photo: false };
  if (!state.reportDraft.asks) state.reportDraft.asks = {};
  return state.reportDraft;
}
function readDraft(step) {
  const d = state.reportDraft; if (!d) return;
  if (step === 1) { const w = document.querySelector('input[name=went]:checked'); d.went = w ? w.value : d.went; d.metWith = $('#r-met').value.trim(); const j = document.querySelector('input[name=joined]:checked'); d.memberJoined = j ? j.value : d.memberJoined; }
  if (step === 2) SEED.bills.forEach(b => { const v = document.querySelector(`input[name=ask-${b.id}]:checked`); if (v) d.asks[b.id] = v.value; });
  if (step === 3) { d.commitment = $('#r-commit').value.trim(); d.followUp = $('#r-follow').checked; d.followUpWhat = $('#r-followwhat').value.trim(); }
  if (step === 4) { d.notes = $('#r-notes').value.trim(); }
}
function reportScreen(id) {
  const m = D().meetings.find(x => x.id === id); const d = draftFor(id); const step = state.reportStep;
  const dots = `<div class="steps" aria-hidden="true">${[1, 2, 3, 4].map(i => `<span class="${i <= step ? 'on' : ''}"></span>`).join('')}</div>`;
  const nav = (last) => `<div class="row" style="gap:8px;margin-top:16px">${step > 1 ? `<button class="btn" data-act="reportStep" data-arg="${step - 1}">Back</button>` : ''}<button class="btn btn-primary" style="flex:1" data-act="${last ? 'submitReport' : 'reportStep'}" data-arg="${last ? id : step + 1}">${last ? (d.id ? 'Update report' : 'Send report') : 'Next'}</button></div>`;
  const head = `<button class="back" data-act="meeting" data-arg="${id}">&#8249; ${esc(m.member)}</button>${dots}`;
  if (step === 1) return `${head}<h1>How did it go?</h1><p class="lede">Step 1 of 4. ${esc(m.member)}, ${fmtTime(m.start)}.</p>
    <fieldset style="border:0;padding:0;margin:12px 0"><legend style="font-weight:700;margin-bottom:8px">Overall</legend><div class="radios">${['Great', 'Good', 'Mixed', 'Difficult'].map(v => `<label><input type="radio" name="went" value="${v}" ${d.went === v ? 'checked' : ''}>${v}</label>`).join('')}</div></fieldset>
    <label class="field"><span>Who did you meet with?</span><input id="r-met" class="input" value="${esc(d.metWith)}"></label>
    <fieldset style="border:0;padding:0;margin:12px 0"><legend style="font-weight:700;margin-bottom:8px">Did the member join?</legend><div class="radios">${['Yes, the whole time', 'Briefly', 'No, staff only'].map(v => `<label><input type="radio" name="joined" value="${v}" ${d.memberJoined === v ? 'checked' : ''}>${v}</label>`).join('')}</div></fieldset>${nav(false)}`;
  if (step === 2) return `${head}<h1>The asks</h1><p class="lede">Step 2 of 4. How did the office respond to each one?</p>
    ${SEED.bills.map(b => `<fieldset style="border:0;padding:0;margin:14px 0"><legend style="font-weight:700;margin-bottom:8px">${esc(b.title)}</legend><div class="radios">${['Supportive', 'Needs more info', 'Not supportive', 'Did not come up'].map(v => `<label><input type="radio" name="ask-${b.id}" value="${v}" ${d.asks[b.id] === v ? 'checked' : ''}>${v}</label>`).join('')}</div></fieldset>`).join('')}${nav(false)}`;
  if (step === 3) return `${head}<h1>Commitments</h1><p class="lede">Step 3 of 4. Anything the office said they would do, and anything we owe them.</p>
    <label class="field"><span>Did the office commit to anything?</span><input id="r-commit" class="input" value="${esc(d.commitment)}" placeholder="Example: will brief the member on cosponsoring"></label>

    <label class="field"><span>What follow-up?</span><input id="r-followwhat" class="input" value="${esc(d.followUpWhat)}" placeholder="Example: send district numbers by Friday"></label>${nav(false)}`;
  return `${head}<h1>Notes and photo</h1><p class="lede">Step 4 of 4. Your in-meeting notes are already here.</p>

}

/* ---------- act ---------- */
function actScreen() {
  const acts = actionsForMe(); const doneN = acts.filter(actionDone).length; const cs = live.campaignStats;
