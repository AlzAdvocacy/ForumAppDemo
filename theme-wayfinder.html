/* ---------- new actions ---------- */
Object.assign(actions, {
  go2(arg) { const [s, id] = arg.split('|'); go(s, id); },
  mode(id) { go('mode', id); },
  checkin(arg) {
    const [status, id] = arg.split('|'); const m = live.meetings.find(x => x.id === id); const me = attendee(state.attendeeId);
    if (state.offline) { showToast('Check-in needs a connection. It will send when you reconnect.'); return; }
    live.checkins[id] = { status, at: nowLabel(), by: state.attendeeId };
    const text = { here: `${firstName(me)} checked in at ${m.building} ${m.room} for ${m.member}.`, late: `${firstName(me)} is running late to ${m.member} in ${m.building} ${m.room}.`, inprogress: `${firstName(me)}: meeting with ${m.member} has started.`, done: `${firstName(me)}: finished with ${m.member}.` }[status];
    postThread(m.state, state.attendeeId, text);
    live.changeLog.push({ at: nowLabel(), by: me.name, what: text, meetingId: id });
    render();
    if (status === 'late') { const lead = leadOf(m); showToast(`Your team and staff can see this.${lead && lead.id !== me.id ? ` ${firstName(lead)} also gets a text.` : ''}`); }
    else if (status === 'here') showToast('Checked in. Staff and your team can see you arrived.');
  },
  saveRoles(id) { const m = live.meetings.find(x => x.id === id); const me = attendee(state.attendeeId); postThread(m.state, state.attendeeId, `${firstName(me)} updated who does what for ${m.member}. Check the meeting page.`); go('meeting', id); showToast('Roles saved and shared with the team.'); },
  report(id) { state.reportDraft = null; state.reportStep = 1; draftFor(id); go('report', id); },
  reportStep(n) { readDraft(state.reportStep); state.reportStep = Number(n); render(); },
  photo() { readDraft(4); state.reportDraft.photo = !state.reportDraft.photo; render(); },
  submitReport(id) {
    readDraft(4); const d = state.reportDraft; d.at = nowLabel();
    const existing = reportFor(id);
    if (existing) Object.assign(existing, d, { id: existing.id });
    else { d.id = uid(); if (state.offline) state.outbox.push(d); else live.reports.push(d); }
    const m = live.meetings.find(x => x.id === id);
    if (!live.checkins[id] || live.checkins[id].status !== 'done') live.checkins[id] = { status: 'done', at: nowLabel(), by: state.attendeeId };
    state.reportDraft = null; state.reportStep = 1;
    go('meeting', id); showToast(state.offline ? 'Saved on your phone. Sends when you reconnect.' : `Report sent. Thank you. A thank-you note to ${m.staffer.split(',')[0]} is ready under Act.`);
  },
  sendThanks(id) { thankedMap()[id] = true; live.campaignStats.thankyous++; const m = live.meetings.find(x => x.id === id); live.changeLog.push({ at: nowLabel(), by: attendee(state.attendeeId).name, what: `Sent thank-you note for ${m.member} (${m.state})`, meetingId: id }); go('meeting', id); showToast('Thank-you note sent (simulated).'); },
  action(aid) { go('action', aid); },
  markDone(aid) { doneMap()[aid] = true; const a = SEED.actions.find(x => x.id === aid); if (a.kind === 'video') live.campaignStats.videos++; if (a.kind === 'social') live.campaignStats.posts++; render(); showToast('Nice. Counted toward the conference total.'); },
  openVideo(aid) { showToast(`Simulated: opening ${CONFIG.videoCollectorUrl}?c=${attendee(state.attendeeId).code} in your browser.`); },
  copyText(aid) { const a = SEED.actions.find(x => x.id === aid); const t = a.kind === 'share' ? `advocate.example.org/join?ref=${attendee(state.attendeeId).code}` : a.suggested; try { navigator.clipboard && navigator.clipboard.writeText(t); } catch (e) { /* ignore */ } showToast('Copied.'); },
  shareText(aid) { doneMap()[aid] = true; live.campaignStats.invites++; render(); showToast('Simulated: your phone\'s share sheet would open with the link.'); },
  sendLetter(aid) { doneMap()[aid] = true; live.campaignStats.letters++; live.changeLog.push({ at: nowLabel(), by: attendee(state.attendeeId).name, what: 'Sent a letter through the action center (simulated)' }); render(); showToast('Letter sent (simulated). Counted toward the conference total.'); },
  quickMsg(text) { if (state.offline) return; postThread(myState(), state.attendeeId, text); state._keepScroll = true; render(); },
  sendMsg() { const el = $('#msg-in'); const t = (el.value || '').trim(); if (!t) return; postThread(myState(), state.attendeeId, t); state._keepScroll = true; render(); setTimeout(() => { const sc = $('#screen'); if (sc) sc.scrollTop = sc.scrollHeight; }, 0); },
  resGroup(g) { state.resGroup = g; state._keepScroll = true; render(); },
  openRes(id) { const r = SEED.resources.find(x => x.id === id); showToast(`Simulated: opens "${r.title}" (${r.type}).`); },
  teamState(s) { state.teamState = s; render(); },
  staffSend(st) { const el = $('#smsg-in'); const t = (el.value || '').trim(); if (!t) return; postThread(st, 'staff', t); render(); },
  staffMsg(arg) { const [st, text] = arg.split('|'); postThread(st, 'staff', text); render(); showToast(`Posted to the ${stateName(st)} thread.`); },
  nudge(id) { const m = live.meetings.find(x => x.id === id); live.changeLog.push({ at: nowLabel(), by: 'Alex Moreno', what: `Texted ${m.member}'s office that the team is running late (simulated)`, meetingId: id }); showToast('Simulated: office notified.'); },
  addRes() {
    const t = $('#rs-title').value.trim(); if (!t) { showToast('Add a title.'); return; }

    live.changeLog.push({ at: nowLabel(), by: 'Dana Whitcomb', what: `Added resource: ${t}` }); render(); showToast('Added. It now shows under Resources for attendees.');
  },

function confetti() {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const phone = $('#phone'); const colors = ['#5E2B86', '#F2C94C', '#0F8B8D', '#C2417A', '#2E7D4F', '#1F5FA6'];

}

    ${['Cannon', 'Longworth', 'Rayburn'].map(n => box(n, 244)).join('')}

  let legs = '';
  if (mine.length) legs += `<div class="leg"><div><b>Hotel to ${esc(mine[0].building)}</b><div class="tiny">Buses run from 7:30 AM. On foot it is a long walk, allow time for security.</div></div><a class="btn btn-sm" target="_blank" rel="noopener" href="${gmaps(CONFIG.hotelMaps, CONFIG.buildingAddresses[mine[0].building])}">Google Maps</a></div>`;
  for (let i = 0; i < mine.length - 1; i++) { const a = mine[i], b = mine[i + 1]; const gap = toMin(b.start) - toMin(a.end); const w = walkMinutes(a.building, b.building); legs += `<div class="leg ${gap < w ? 'tight' : ''}"><div><b>${esc(a.building)} ${esc(a.room)} to ${esc(b.building)} ${esc(b.room)}</b><div class="tiny">${gap} min gap. ${w === 0 ? 'Same building.' : 'About ' + w + ' min walk (approximate).'}${gap < w ? ' Tight.' : ''}</div></div>${w ? `<a class="btn btn-sm" target="_blank" rel="noopener" href="${gmaps(CONFIG.buildingAddresses[a.building], CONFIG.buildingAddresses[b.building])}">Google Maps</a>` : ''}</div>`; }
  return `<button class="back" data-act="tab" data-arg="meetings">&#8249; My meetings</button>
    <h1>Map</h1><p class="lede">Your stops are shaded. Each leg opens walking directions in the Google Maps app.</p>
    <div class="mapwrap">${svg}</div>
    <div class="callout"><b>Staff tips the map does not know.</b> Tunnels connect buildings on the same side. Security lines run 10 to 20 minutes; Hart and Longworth usually move fastest. Google's route may send you around the Capitol instead of through it.</div>
    ${mine.length ? `<h2>Your route today</h2>${legs}` : '<div class="empty"><b>No stops yet</b>Your route appears once your meetings are assigned.</div>'}
    <p class="tiny">Links open Google Maps without sign-in. The production app can also show a live Google map here; see "How this would work" in Staff view.</p>`;
}

Object.assign(actions, {

    live.checkins[id] = { status, at: nowLabel(), by: state.attendeeId };

    postThread(gkey(id), state.attendeeId, text);
    live.changeLog.push({ at: nowLabel(), by: me.name, what: `${text} (${m.member}, ${m.state})`, meetingId: id });
    render();
    if (status === 'late') { const lead = leadOf(m); showToast(`Your group and staff can see this.${lead && lead.id !== me.id ? ` ${firstName(lead)} also gets a text.` : ''}`); }

});

function nextItem() {
  const d = D(); const items = [];
  d.sessions.filter(s => !s.umbrella).forEach(s => items.push({ day: s.day, start: s.start, kind: 'session', ref: s }));
  myMeetings(d).filter(m => m.status !== 'cancelled').forEach(m => items.push({ day: CONFIG.meetingDay, start: m.start, kind: 'meeting', ref: m }));
  items.sort((a, b) => (a.day - b.day) || (toMin(a.start) - toMin(b.start)));
  return items.find(i => secondsUntil(i.day, i.start) > -1800);

function isStandalone() { return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true; }

function isIOS() { return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
function applyAppMode() { const on = isStandalone() || isPhone(); document.documentElement.classList.toggle('app', on); document.body.classList.toggle('app', on); return on; }
function todayKey() { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; }

/* ---------- demo clock: Hill Day is always today ---------- */
CONFIG.clockPresets = [
  { label: 'Day 1, 3:40 PM (Welcome Program soon)', day: 1, time: '15:40' },
  { label: 'Day 1, 7:15 PM (evening before Hill Day)', day: 1, time: '19:15' },
  { label: 'Hill Day, 7:45 AM (changes rolling in)', day: 2, time: '07:45' },
  { label: 'Hill Day, 8:05 AM', day: 2, time: '08:05' },
  { label: 'Hill Day, 11:20 AM', day: 2, time: '11:20' },
  { label: 'Hill Day, matching the real time now', day: 2, time: 'now' },
  { label: 'Day 3, 8:30 AM', day: 3, time: '08:30' }
];
const HILL_PRESET = 2, REALTIME_PRESET = 5;

function presetSecs(p) { if (p.time === 'now') { const d = new Date(); return d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds(); } return toMin(p.time) * 60; }
simNow = function () {
  const p = CONFIG.clockPresets[state.clockPreset] || CONFIG.clockPresets[HILL_PRESET];
  const secs = p.time === 'now' ? presetSecs(p) : presetSecs(p) + Math.floor((Date.now() - state.clockBase) / 1000);
  return { day: p.day, secs };
};

function relativeDays() {
  const today = new Date(); today.setHours(12, 0, 0, 0);
  const hill = CONFIG.meetingDay;
  const short = d => d.toLocaleDateString('en-US', { weekday: 'short' });
  const long = d => d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  const md = d => d.toLocaleDateString('en-US', { month: 'long', day: 'numeric' });
  const dated = CONFIG.days.map(x => { const d = new Date(today); d.setDate(today.getDate() + (x.n - hill)); return { x, d }; });
  const first = dated[0].d, last = dated[dated.length - 1].d;
  CONFIG.dateNote = first.getMonth() === last.getMonth() ? `${md(first)} to ${last.getDate()}, ${last.getFullYear()}` : `${md(first)} to ${md(last)}, ${last.getFullYear()}`;
  CONFIG.days = dated.map(({ x, d }) => Object.assign({}, x, { short: short(d), long: long(d) }));
  return { Mon: CONFIG.days[0].short, Tue: CONFIG.days[1].short, Wed: CONFIG.days[2].short };
}
const DAY_TOKEN = /^(Mon|Tue|Wed)( \d{1,2}:\d{2} [AP]M)$/;
function relabel(o, map) {
  if (!o || typeof o !== 'object') return;
  for (const k of Object.keys(o)) {
    const v = o[k];
    if (typeof v === 'string') { const m = v.match(DAY_TOKEN); if (m) o[k] = map[m[1]] + m[2]; }
    else if (v && typeof v === 'object') relabel(v, map);
  }
}
const _resetData = resetData;
resetData = function () { _resetData(); relabel(live, DAYMAP); };

/* ---------- saved demo state (survives the phone closing the app) ---------- */
const TRANSIENT = ['editing', 'entryError', 'queuedBanner', '_keepScroll', 'fullscreen', 'fsOpen', 'demoCollapsed', 'offline', 'netOffline', 'staffQuery', 'rosterQuery', 'staffSearch'];
function saveNow() {
  const s = {}; for (const k of Object.keys(state)) if (!TRANSIENT.includes(k)) s[k] = state[k];
  const base = { v: 1, day: todayKey(), savedAt: Date.now(), lastParams: BOOT.lastParams, state: s };
  try { localStorage.setItem(STORE_KEY, JSON.stringify(Object.assign({ live }, base))); }
  catch (e) { try { localStorage.setItem(STORE_KEY, JSON.stringify(base)); } catch (e2) { /* storage full or blocked; the demo still runs */ } }
}
let saveTimer = null;
function queueSave() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 800); }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveNow(); });
window.addEventListener('pagehide', saveNow);

/* ---------- render hook ---------- */
const _render = render;
render = function () { _render(); afterRender(); queueSave(); };
function afterRender() { const slot = document.getElementById('gmap-slot'); if (slot) mountMap(slot); }

/* ---------- demo panel: triple-tap the logo in app mode ---------- */
function openDemo() { state.demoCollapsed = false; document.body.classList.add('demo-open'); renderDemo(); }
function closeDemo() { document.body.classList.remove('demo-open'); }
let logoTaps = [];
document.addEventListener('click', e => {
  if (!document.body.classList.contains('app')) return;
  if (!e.target.closest('.app-head .logo, .entry .logo-big')) return;
  const now = Date.now(); logoTaps = logoTaps.filter(t => now - t < 900); logoTaps.push(now);
  if (logoTaps.length >= 3) { logoTaps = []; openDemo(); }
});
const _renderDemo = renderDemo;
renderDemo = function () {
  _renderDemo();
  const demo = $('#demo'); if (!demo) return;
  const clockSel = demo.querySelector('[data-change="clock"]');
  if (clockSel) clockSel.parentElement.insertAdjacentHTML('afterend', `<div class="group hide-when-collapsed">
      <button class="dbtn go" data-act="clockJump" data-arg="${HILL_PRESET}">Jump to Hill Day morning</button>
      <button class="dbtn" data-act="clockJump" data-arg="${REALTIME_PRESET}">Hill Day at the real time</button>
      <button class="dbtn" data-act="simLater">Schedule change in 10 seconds</button>
      <a class="dbtn" href="links.html">Persona links and QR codes</a></div>`);
  if (document.body.classList.contains('app')) demo.insertAdjacentHTML('afterbegin', `<button class="dbtn go" data-act="demoClose" style="order:-1">Done</button>`);
};
Object.assign(actions, {
  demoClose() { closeDemo(); },
  clockJump(i) {
    state.clockPreset = Number(i); state.clockBase = Date.now();
    if (state.view === 'attendee' && state.attendeeId) { state.screen = 'home'; state.arg = null; }
    closeDemo(); render(); showToast(`Clock: ${CONFIG.clockPresets[state.clockPreset].label}`);
  },
  simLater() {
    closeDemo();
    showToast('A schedule change arrives in 10 seconds.');
    setTimeout(() => { simulateChange(); }, 10000);
  },
  installApp() {
    if (!deferredInstall) return;
    deferredInstall.prompt();
    deferredInstall.userChoice.finally(() => { deferredInstall = null; render(); });
  },
  optinReal() {
    if (!('Notification' in window)) { actions.optin(); return; }
    Notification.requestPermission().then(r => {
      if (r === 'granted') actions.optin();
      else { go('alerts'); showToast('Alerts are off in your phone settings. Texts still come through.'); }
    }).catch(() => actions.optin());
  }
});
document.addEventListener('change', e => { const el = e.target.closest('[data-change="pick"]'); if (el && document.body.classList.contains('app')) setTimeout(closeDemo, 50); });

/* ---------- phone notifications ---------- */
function canAskNotify() { return 'Notification' in window && 'serviceWorker' in navigator && (isStandalone() || !isIOS()); }
function systemNotify(title, body, meetingId) {
  if (!('Notification' in window) || Notification.permission !== 'granted' || !navigator.serviceWorker) return;
  navigator.serviceWorker.ready.then(reg => reg.showNotification(title, { body, tag: 'forum-' + (meetingId || 'news'), icon: 'icons/icon-192.png', badge: 'icons/icon-192.png', data: { meetingId: meetingId || null } })).catch(() => { });
}
const _showPush = showPush;
showPush = function (title, body, meetingId) {
  _showPush(title, body, meetingId);
  const label = document.querySelector('#push .pt span'); if (label) label.textContent = APP.shortName;
  try { if (navigator.vibrate) navigator.vibrate([180, 90, 180]); } catch (e) { /* not supported */ }
  if (document.visibilityState !== 'visible') systemNotify(title, body, meetingId);
};
if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', ev => {
  if (ev.data && ev.data.open && state.attendeeId) { state.view = 'attendee'; markRead(null, ev.data.open); go('meeting', ev.data.open); }
});
const _onboardScreen = onboardScreen;
onboardScreen = function () {
  if (isStandalone() && state.onboardStep < 4) state.onboardStep = 4;
  if (state.onboardStep === 4 && canAskNotify()) {
    return `<button class="back" data-act="tab" data-arg="alerts">&#8249; Alerts</button>
      <h1>Turn on alerts</h1><p class="lede">When a meeting moves, this phone buzzes. Your phone asks first. Tap Allow.</p>
      <button class="btn btn-primary btn-block" data-act="optinReal">Turn on alerts</button>
      <button class="btn btn-ghost btn-block" data-act="tab" data-arg="alerts">Not now, texts are enough</button>`;
  }
  const name = esc(APP.shortName), ev = esc(CONFIG.eventName);
  return _onboardScreen().split(`Open ${ev} from your Home Screen`).join(`Open ${name} from your Home Screen`).split(`"${ev}" Would Like`).join(`"${name}" Would Like`);
};
document.addEventListener('change', e => {
  const el = e.target.closest('[data-change="push"]');
  if (el && el.checked && canAskNotify() && Notification.permission === 'default') Notification.requestPermission().catch(() => { });
});

/* ---------- install prompts ---------- */
let deferredInstall = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; render(); });
window.addEventListener('appinstalled', () => { deferredInstall = null; showToast('Installed. Open it from your Home Screen.'); });
function installCard() {
  if (isStandalone() || !(isPhone() || isIOS())) return '';
  if (deferredInstall) return `<div class="install"><b>Install the app on this phone</b><span class="small muted">It opens full screen and keeps working without a signal.</span><button class="btn btn-primary btn-block" style="margin-top:10px" data-act="installApp">Install</button></div>`;
  if (isIOS()) return `<div class="install"><b>Put this app on your Home Screen</b><span class="small muted">Tap Share, then Add to Home Screen. It opens full screen and keeps working without a signal.</span></div>`;
  return '';
}
const _entryScreen = entryScreen;
entryScreen = function () { return _entryScreen().replace('<hr class="soft">', '<hr class="soft">' + installCard()); };
const _moreScreen = moreScreen;
moreScreen = function () { return _moreScreen().replace('<h1>More</h1>', '<h1>More</h1>' + installCard()); };

/* ---------- real offline: airplane mode shows the saved schedule ---------- */
window.addEventListener('offline', () => { if (!state.offline) { state.netOffline = true; toggleOffline(); } });
window.addEventListener('online', () => { if (state.offline && state.netOffline) { state.netOffline = false; toggleOffline(); } });

/* ---------- live Google map (needs a key in app-config.js and a connection) ---------- */
const BUILDING_LL = { Russell: [38.8925, -77.0072], Dirksen: [38.8928, -77.0047], Hart: [38.8925, -77.0036], Cannon: [38.8869, -77.0069], Longworth: [38.8867, -77.0093], Rayburn: [38.8867, -77.0111] };
const CAPITOL_LL = [38.8898, -77.0091];
const MAPS = { loading: null, failed: false, el: null, map: null, markers: [], line: null };
function liveMapOK() { return !!APP.googleMapsKey && !state.offline && navigator.onLine && !MAPS.failed; }
function loadMaps() {
  if (window.google && google.maps && google.maps.importLibrary) return Promise.resolve();
  if (MAPS.loading) return MAPS.loading;
  MAPS.loading = new Promise((resolve, reject) => {
    window.__gmReady = resolve;
    window.gm_authFailure = () => { MAPS.failed = true; console.warn('Google Maps rejected the key. Check app-config.js and the key restrictions.'); render(); };
    const s = document.createElement('script');
    s.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(APP.googleMapsKey)}&v=weekly&loading=async&callback=__gmReady`;
    s.async = true; s.onerror = () => { MAPS.failed = true; reject(new Error('maps script failed')); render(); };
    document.head.appendChild(s);
  });
  return MAPS.loading;
}
async function mountMap(slot) {
  if (!MAPS.el) { MAPS.el = document.createElement('div'); MAPS.el.className = 'gmap'; }
  slot.appendChild(MAPS.el);
  try {
    await loadMaps();
    const { Map, Polyline, LatLngBounds } = await google.maps.importLibrary('maps');
    const { AdvancedMarkerElement } = await google.maps.importLibrary('marker');
    if (!MAPS.map) MAPS.map = new Map(MAPS.el, { center: { lat: CAPITOL_LL[0], lng: CAPITOL_LL[1] }, zoom: 16, mapId: APP.googleMapId, disableDefaultUI: true, zoomControl: true, gestureHandling: 'greedy', clickableIcons: false });
    drawMap(AdvancedMarkerElement, Polyline, LatLngBounds);
  } catch (e) { MAPS.failed = true; render(); }
}
function pinEl(cls, html) { const d = document.createElement('div'); d.className = 'gpin ' + cls; d.innerHTML = html; return d; }
function drawMap(AdvancedMarkerElement, Polyline, LatLngBounds) {
  const map = MAPS.map;
  MAPS.markers.forEach(m => { m.map = null; }); MAPS.markers = [];
  if (MAPS.line) { MAPS.line.setMap(null); MAPS.line = null; }
  const mine = myMeetings().filter(m => m.status !== 'cancelled');
  const stops = {}; mine.forEach((m, i) => { (stops[m.building] = stops[m.building] || []).push(i + 1); });
  const bounds = new LatLngBounds();
  const add = (ll, el, title, z) => { const pos = { lat: ll[0], lng: ll[1] }; MAPS.markers.push(new AdvancedMarkerElement({ map, position: pos, content: el, title, zIndex: z })); return pos; };
  Object.keys(BUILDING_LL).forEach(name => {
    const ll = BUILDING_LL[name]; const s = stops[name];
    const pos = add(ll, s ? pinEl('mine', `<b>${s.join(', ')}</b>${esc(name)}`) : pinEl('', esc(name)), s ? `${name}: stop ${s.join(' and ')}` : name, s ? 10 : 1);
    if (s || !mine.length) bounds.extend(pos);
  });
  bounds.extend(add(CAPITOL_LL, pinEl('capitol', 'Capitol'), 'U.S. Capitol', 2));
  if (APP.hotel && APP.hotel.lat) add([APP.hotel.lat, APP.hotel.lng], pinEl('hotel', esc(APP.hotel.name || 'Hotel')), APP.hotel.name || 'Hotel', 3);
  if (mine.length > 1) {
    const path = mine.map(m => ({ lat: BUILDING_LL[m.building][0], lng: BUILDING_LL[m.building][1] }));
    MAPS.line = new Polyline({ map, path, strokeOpacity: 0, icons: [{ icon: { path: 'M 0,-1 0,1', strokeOpacity: 1, strokeColor: '#4A0D66', scale: 3 }, offset: '0', repeat: '12px' }] });
  }
  map.fitBounds(bounds, 48);
}
const _mapScreen = mapScreen;
mapScreen = function () {
  let html = _mapScreen();
  if (liveMapOK()) {
    html = html.replace(/<div class="mapwrap">[\s\S]*?<\/svg><\/div>/, '<div class="gmap-slot" id="gmap-slot" role="region" aria-label="Map of your stops on Capitol Hill"></div>')
      .replace('Your stops are shaded.', 'Your stops are numbered in order.')
      .replace(/<p class="tiny">Links open Google Maps[\s\S]*?<\/p>/, '<p class="tiny">Pins show approximate building locations. Links open Google Maps without sign-in.</p>');
  } else {
    const why = (state.offline || !navigator.onLine) ? 'The live map needs a connection. This simple map is saved on your phone.' : MAPS.failed ? 'The live map did not load, so the simple map is showing.' : '';
    if (why) html = html.replace('<div class="mapwrap">', `<p class="mapnote">${why}</p><div class="mapwrap">`);
  }
  return html;
};

/* ---------- start ---------- */
function hideSplash() {
  const s = document.getElementById('splash'); if (!s) return;
  setTimeout(() => { s.classList.add('gone'); setTimeout(() => s.remove(), 400); }, isStandalone() ? 650 : 0);
}
function boot() {
  applyAppMode();
  DAYMAP = relativeDays();
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) { saved = null; }
  if (saved && saved.v === 1) {
    if (saved.day === todayKey() && saved.live) { live = saved.live; snapshot = null; } else resetData();
    Object.assign(state, saved.state || {});
    BOOT.lastParams = saved.lastParams || '';
    if (Date.now() - (saved.savedAt || 0) > 30 * 60 * 1000) state.clockBase = Date.now();
  } else {
    resetData(); state.clockPreset = HILL_PRESET + 1; state.clockBase = Date.now();
  }
  if (!CONFIG.clockPresets[state.clockPreset]) state.clockPreset = HILL_PRESET;
  state.offline = false; state.netOffline = false; state.editing = null; state.queuedBanner = null;

  // Persona links: ?c=CODE opens as that attendee, ?view=staff opens Staff view.
  // A link is applied once, so switching personas in the demo panel sticks after a relaunch.
  const params = new URLSearchParams(location.search);
  const pkey = ['c', 'view'].filter(k => params.get(k)).map(k => `${k}=${params.get(k)}`).join('&');
  if (pkey && pkey !== BOOT.lastParams) {
    const c = (params.get('c') || '').toUpperCase(); const a = c ? live.attendees.find(x => x.code === c) : null;
    if (a) { state.demoCode = c; state.attendeeId = a.id; state.view = 'attendee'; state.screen = 'home'; state.arg = null; state.onboardStep = 1; }
    if (params.get('view') === 'staff') state.view = 'staff';
    BOOT.lastParams = pkey;
  }
  if (!navigator.onLine) { state.offline = true; state.netOffline = true; snapshot = deepCopy(live); }
  render();
  if (params.has('demo')) openDemo();
  hideSplash();
  window.addEventListener('resize', () => { const was = document.body.classList.contains('app'); if (applyAppMode() !== was) render(); });
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname))) {
    navigator.serviceWorker.register('sw.js').catch(() => { /* offline support unavailable */ });
  }
}
boot();

</script>
